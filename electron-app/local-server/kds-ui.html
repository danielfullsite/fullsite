<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Cocina — Fullsite KDS</title>
<style>
  :root{
    --bg:#0b0f14; --surface:#111820; --surface-2:#161f2a; --line:#243040;
    --text-1:#f2f6fb; --text-2:#c4cfdc; --text-3:#8a97a8; --text-4:#5f6b7a;
    --new:#3b82f6; --prep:#f59e0b; --lista:#10b981; --danger:#ef4444;
    --cocina:#f59e0b; --barra:#38bdf8; --caja:#a78bfa;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text-1);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-shrink:0}
  .brand{display:flex;align-items:center;gap:12px}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.3px}
  .brand .chef{font-size:22px}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .conn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3)}
  .counts{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--text-3)}
  .counts b{color:var(--text-1)}
  .counts .c-new{color:var(--new)} .counts .c-prep{color:var(--prep)} .counts .c-lista{color:var(--lista)}
  #clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text-3)}
  main{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-content:start}
  .empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;color:var(--text-4);gap:14px}
  .empty .chef{font-size:52px;opacity:.5}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;border-left:5px solid var(--new)}
  .card.s-preparando{border-left-color:var(--prep)}
  .card.s-lista{border-left-color:var(--lista)}
  .card.urgent{animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{border-left-color:var(--danger)}50%{border-left-color:#7f1d1d}}
  @media (prefers-reduced-motion: reduce){.card.urgent{animation:none;border-left-color:var(--danger)}}
  .card-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-2)}
  .mesa{font-size:24px;font-weight:800;line-height:1}
  .mesa small{font-size:12px;font-weight:600;color:var(--text-3);display:block;margin-top:3px}
  .time{text-align:right;font-size:13px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .time.warn{color:var(--prep)} .time.late{color:var(--danger);font-weight:700}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
  .b-new{background:rgba(59,130,246,.18);color:#93c5fd}
  .b-prep{background:rgba(245,158,11,.18);color:#fcd34d}
  .b-lista{background:rgba(16,185,129,.18);color:#6ee7b7}
  .items{padding:6px 14px 10px}
  .batch{padding:8px 0;border-top:1px dashed var(--line)}
  .batch:first-child{border-top:none}
  .batch-h{font-size:10px;color:var(--text-4);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .item{display:flex;gap:9px;padding:4px 0;align-items:flex-start}
  .qty{min-width:26px;height:26px;border-radius:7px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .it-body{flex:1;min-width:0}
  .it-name{font-size:15px;font-weight:600;line-height:1.25}
  .it-name .st{font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:middle;text-transform:uppercase}
  .st-cocina{background:rgba(245,158,11,.2);color:#fcd34d}
  .st-barra{background:rgba(56,189,248,.2);color:#7dd3fc}
  .st-caja{background:rgba(167,139,250,.2);color:#c4b5fd}
  .mods{font-size:12px;color:var(--prep);margin-top:1px;line-height:1.3}
  .note{font-size:12px;color:var(--text-3);font-style:italic}
  .card-f{display:flex;border-top:1px solid var(--line);margin-top:auto}
  .btn{flex:1;padding:13px;border:none;background:transparent;color:var(--text-1);font-size:14px;font-weight:700;cursor:pointer}
  .btn:active{background:var(--line)}
  .btn-prep{color:#fcd34d} .btn-lista{color:#6ee7b7} .btn-done{color:var(--text-3)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:12px 20px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="chef">👨‍🍳</span>
      <h1>Cocina</h1>
      <span class="conn"><span class="dot" id="conn-dot"></span><span id="conn-txt">conectando…</span></span>
    </div>
    <div class="counts">
      <span class="c-new">Nuevas <b id="n-new">0</b></span>
      <span class="c-prep">Preparando <b id="n-prep">0</b></span>
      <span class="c-lista">Listas <b id="n-lista">0</b></span>
      <span id="clock">--:--</span>
    </div>
  </header>
  <main id="board">
    <div class="empty"><span class="chef">👨‍🍳</span><div>Sin órdenes pendientes</div><div style="font-size:12px">Se actualiza cada 2 segundos</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  // Injected by Pedro at serve time (see index.js). Falls back to same-origin.
  var CFG = window.__KDS_CFG__ || {};
  var STATE_BASE = (CFG.bridge_base || "").replace(/\/$/,"");   // e.g. http://192.168.1.71:7717  ("" = same origin)
  var ALERT_MIN = 12;            // minutes → urgent
  var POLL_MS = 2000;

  var boardEl = document.getElementById("board");
  var connDot = document.getElementById("conn-dot");
  var connTxt = document.getElementById("conn-txt");
  var toastEl = document.getElementById("toast");
  var prevIds = null;            // Set of enviada order ids seen (for new-order sound)
  var lastGood = [];             // last successfully-fetched orders (offline fallback)
  var online = false;

  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 2200); }

  function beep(){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      [880,1180].forEach(function(f,i){
        setTimeout(function(){
          var o=ctx.createOscillator(), g=ctx.createGain();
          o.connect(g); g.connect(ctx.destination); o.type="sine"; o.frequency.value=f; g.gain.value=.3;
          o.start(); g.gain.exponentialRampToValueAtTime(.01, ctx.currentTime+.4); o.stop(ctx.currentTime+.4);
          if(i) setTimeout(function(){ctx.close().catch(function(){});}, 500);
        }, i*180);
      });
    }catch(e){}
  }

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function parseItems(raw){
    if(Array.isArray(raw)) return raw;
    if(typeof raw==="string"){ try{ return JSON.parse(raw)||[]; }catch(e){ return []; } }
    return [];
  }
  function parseBatches(raw){
    if(raw && typeof raw==="object" && !Array.isArray(raw)) return raw;
    if(typeof raw==="string"){ try{ return JSON.parse(raw)||{}; }catch(e){ return {}; } }
    return {};
  }

  function elapsed(iso){
    var t = Date.parse(iso)||Date.now();
    var m = Math.max(0, Math.floor((Date.now()-t)/60000));
    if(m<60) return m+" min";
    return Math.floor(m/60)+"h "+(m%60)+"m";
  }

  function stationTag(st){
    st = (st||"cocina").toLowerCase();
    var cls = st==="barra"?"st-barra":st==="caja"?"st-caja":"st-cocina";
    return '<span class="st '+cls+'">'+esc(st)+'</span>';
  }

  function nextStatus(s){ return s==="enviada"?"preparando":s==="preparando"?"lista":"entregada"; }

  function render(orders){
    // sort: oldest first (FIFO), by created_at
    orders = orders.slice().sort(function(a,b){ return (Date.parse(a.created_at)||0)-(Date.parse(b.created_at)||0); });
    var nNew=0,nPrep=0,nLista=0;
    orders.forEach(function(o){ if(o.status==="lista")nLista++; else if(o.status==="preparando")nPrep++; else nNew++; });
    document.getElementById("n-new").textContent=nNew;
    document.getElementById("n-prep").textContent=nPrep;
    document.getElementById("n-lista").textContent=nLista;

    if(!orders.length){
      boardEl.innerHTML='<div class="empty"><span class="chef">👨‍🍳</span><div>Sin órdenes pendientes</div><div style="font-size:12px">Se actualiza cada 2 segundos</div></div>';
      return;
    }
    var html="";
    orders.forEach(function(o){
      var items = parseItems(o.items);
      var batches = parseBatches(o.comanda_batches);
      var st = o.status||"enviada";
      var el = elapsed(o.created_at);
      var mins = Math.floor((Date.now()-(Date.parse(o.created_at)||Date.now()))/60000);
      var urgent = mins>=ALERT_MIN && st!=="lista";
      var timeCls = mins>=ALERT_MIN?"late":(mins>=ALERT_MIN*0.6?"warn":"");

      // group items by comanda_batch_seq
      var groups={};
      items.forEach(function(it){ var k=(it.comanda_batch_seq==null?0:it.comanda_batch_seq); (groups[k]=groups[k]||[]).push(it); });
      var seqs=Object.keys(groups).map(Number).sort(function(a,b){return a-b;});

      var body="";
      seqs.forEach(function(seq){
        body+='<div class="batch">';
        if(seqs.length>1) body+='<div class="batch-h">'+(seq===0?"Comanda inicial":"Ronda "+seq)+'</div>';
        groups[seq].forEach(function(it){
          var mods=(it.modificadores||[]).filter(Boolean);
          body+='<div class="item"><div class="qty">'+esc(it.cantidad||1)+'</div><div class="it-body">'+
            '<div class="it-name">'+esc(it.nombre||"—")+stationTag(it.station)+'</div>'+
            (mods.length?'<div class="mods">'+esc(mods.join(" · "))+'</div>':'')+
            (it.notas?'<div class="note">“'+esc(it.notas)+'”</div>':'')+
          '</div></div>';
        });
        body+='</div>';
      });

      var badge = st==="lista"?'<span class="badge b-lista">Lista</span>':st==="preparando"?'<span class="badge b-prep">Preparando</span>':'<span class="badge b-new">Nueva</span>';
      var ns = nextStatus(st);
      var btnLabel = st==="enviada"?"▶ Preparar":st==="preparando"?"✓ Lista":"Entregada ✓";
      var btnCls = st==="enviada"?"btn-prep":st==="preparando"?"btn-lista":"btn-done";

      html+='<div class="card s-'+st+(urgent?' urgent':'')+'" data-id="'+esc(o.id)+'">'+
        '<div class="card-h"><div class="mesa">'+(o.mesa?("Mesa "+esc(o.mesa)):"Para llevar")+'<small>'+esc(o.mesero||"")+'</small></div>'+
        '<div style="text-align:right">'+badge+'<div class="time '+timeCls+'">'+el+'</div></div></div>'+
        '<div class="items">'+body+'</div>'+
        '<div class="card-f"><button class="btn '+btnCls+'" data-adv="'+esc(o.id)+'" data-next="'+ns+'">'+btnLabel+'</button></div>'+
      '</div>';
    });
    boardEl.innerHTML=html;

    // new-order sound: compare enviada id sets
    var envIds = new Set(orders.filter(function(o){return o.status==="enviada";}).map(function(o){return o.id;}));
    if(prevIds!==null){
      var hasNew=false; envIds.forEach(function(id){ if(!prevIds.has(id)) hasNew=true; });
      if(hasNew) beep();
    }
    prevIds=envIds;
  }

  function setConn(ok){
    online=ok;
    connDot.style.background = ok? "var(--lista)" : "var(--danger)";
    connTxt.textContent = ok? "conectado" : "sin conexión — reintentando";
  }

  function fetchState(){
    var url = STATE_BASE + "/state";
    var ctrl = new AbortController(); var to=setTimeout(function(){ctrl.abort();},4000);
    fetch(url,{cache:"no-store",signal:ctrl.signal}).then(function(r){ return r.ok?r.json():Promise.reject(); }).then(function(data){
      clearTimeout(to);
      var orders = (data && data.kds_orders) || [];
      lastGood = orders;
      setConn(true);
      render(orders);
    }).catch(function(){
      clearTimeout(to);
      setConn(false);
      // keep showing last known orders when the caja is briefly unreachable
      render(lastGood);
    });
  }

  function advance(id, next){
    var o = lastGood.find(function(x){return x.id===id;}); if(!o) return;
    var cmd = { command_id: (id+"-"+next+"-"+Math.floor(Date.now()/1000)), command_type:"ORDER_UPSERTED", order_id:id, mesa:o.mesa, status:next, client_id:(CFG.client_id||"") };
    // optimistic local update
    if(next==="entregada"){ lastGood = lastGood.filter(function(x){return x.id!==id;}); }
    else { o.status=next; }
    render(lastGood);
    fetch(STATE_BASE+"/events",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(cmd)})
      .then(function(r){ if(!r.ok) throw 0; }).catch(function(){ toast("Sin conexión al servidor — se reintentará"); });
  }

  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-adv]"); if(b) advance(b.getAttribute("data-adv"), b.getAttribute("data-next"));
  });

  function tick(){ var d=new Date(); document.getElementById("clock").textContent=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
  tick(); setInterval(tick,15000);

  fetchState();
  setInterval(fetchState, POLL_MS);
})();
</script>
</body>
</html>
