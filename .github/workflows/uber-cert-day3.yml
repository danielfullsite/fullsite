name: UBER Day 3 - Scope Probe + Delivery APIs + Fresh Evidence

on:
  workflow_dispatch:

jobs:
  day3:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://app.fullsite.mx
      INTEGRATION_ADMIN_SECRET: ${{ secrets.INTEGRATION_ADMIN_SECRET }}
      CERT_STORE_ID: 0f655507-7337-41e9-b536-5fd6171bb0da

    steps:
      - name: D3-001 - Health check (deploy Ready)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" "$APP_URL/api/integrations/uber-eats/webhook")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "D3-001 health: HTTP $HTTP_CODE - $BODY"
          echo "D3001_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "D3001_BODY=$BODY" >> $GITHUB_ENV

      - name: D3-002 - Scope probe (granted vs requested delta)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"scope_probe\",\"store_id\":\"$CERT_STORE_ID\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "D3-002 scope_probe: HTTP $HTTP_CODE"
          GRANTED=$(echo "$BODY" | jq -r '.scopes_granted // [] | join(", ")' 2>/dev/null || echo "?")
          DELTA=$(echo "$BODY" | jq -r '.scopes_delta // [] | join(", ")' 2>/dev/null || echo "?")
          # Promociones: Uber las concede por separado, así que hasta ahora el probe
          # salía limpio aunque no estuvieran. Se reporta explícito.
          PROMO_GRANTED=$(echo "$BODY" | jq -r '.phases.phase4_promotions.scopes_granted // [] | join(", ")' 2>/dev/null || echo "?")
          PROMO_MISSING=$(echo "$BODY" | jq -r '.phases.phase4_promotions.scopes_missing // [] | join(", ")' 2>/dev/null || echo "?")
          PROMO_BLOCKER=$(echo "$BODY" | jq -r '.phases.phase4_promotions.blocker // "ninguno"' 2>/dev/null || echo "?")
          echo "  promociones concedidas: ${PROMO_GRANTED:-(ninguna)}"
          echo "  promociones faltantes : ${PROMO_MISSING:-(ninguna)}"
          echo "  promociones blocker   : $PROMO_BLOCKER"
          echo "D3002_PROMO_GRANTED=$PROMO_GRANTED" >> $GITHUB_ENV
          echo "D3002_PROMO_MISSING=$PROMO_MISSING" >> $GITHUB_ENV
          CORR=$(echo "$BODY" | jq -r '.correlation_id // "?"' 2>/dev/null || echo "?")
          echo "  scopes_granted: $GRANTED"
          echo "  scopes_delta:   $DELTA"
          echo "  correlation_id: $CORR"
          echo "D3002_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "D3002_GRANTED=$GRANTED" >> $GITHUB_ENV
          echo "D3002_DELTA=$DELTA" >> $GITHUB_ENV
          echo "D3002_CORR=$CORR" >> $GITHUB_ENV

      - name: D3-003 - Re-auth URL (escrita al resumen PRIVADO del run)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"reauth_url\",\"store_id\":\"$CERT_STORE_ID\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          REAUTH_URL=$(echo "$BODY" | jq -r '.authorize_url // .reauth_url // .url // empty' 2>/dev/null || echo "")
          echo "D3-003 reauth_url: HTTP $HTTP_CODE"
          echo "D3003_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          # Escribe la URL + scopes faltantes al RESUMEN del run (visible solo para
          # miembros del repo privado), NO al log general. Así Daniel concede scopes
          # sin Telegram: abre el run en GitHub → Summary → click en la URL.
          {
            echo "## 🔑 Uber — concede los scopes que faltan"
            echo ""
            echo "- **scopes concedidos:** \`${D3002_GRANTED:-(vacío)}\`"
            echo "- **promociones concedidas:** \`${D3002_PROMO_GRANTED:-(ninguna)}\`"
            echo "- **promociones faltantes:** \`${D3002_PROMO_MISSING:-(ninguna)}\`"
            echo "- **scopes que faltan (delta):** \`${D3002_DELTA:-(vacío)}\`"
            echo ""
            if [ -n "$REAUTH_URL" ]; then
              echo "### 👉 Abre esta URL y autoriza (concede los scopes):"
              echo ""
              echo "<$REAUTH_URL>"
            else
              echo "_No se pudo extraer la URL de reauth del body (HTTP $HTTP_CODE). Revisa el paso._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: D3-004 - Delivery Store APIs + real order attempt (day3_full)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"day3_full\",\"store_id\":\"$CERT_STORE_ID\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "D3-004 day3_full: HTTP $HTTP_CODE"
          STORE_APIS=$(echo "$BODY" | jq -r '.summary.delivery_store_apis // "?"' 2>/dev/null || echo "?")
          PIPELINE=$(echo "$BODY" | jq -r '.summary.internal_pipeline // "?"' 2>/dev/null || echo "?")
          REAL_ORDER=$(echo "$BODY" | jq -r '.summary.real_order // "?"' 2>/dev/null || echo "?")
          EVIDENCE=$(echo "$BODY" | jq -r '.summary.uber_evidence_status // "?"' 2>/dev/null || echo "?")
          RUN_ID=$(echo "$BODY" | jq -r '.day3_run_id // "?"' 2>/dev/null || echo "?")
          echo "  delivery_store_apis: $STORE_APIS"
          echo "  internal_pipeline:   $PIPELINE"
          echo "  real_order:          $REAL_ORDER"
          echo "  uber_evidence_status: $EVIDENCE"
          echo "  day3_run_id: $RUN_ID"
          echo "D3004_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "D3004_STORE_APIS=$STORE_APIS" >> $GITHUB_ENV
          echo "D3004_REAL_ORDER=$REAL_ORDER" >> $GITHUB_ENV
          echo "D3004_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: D3-005 - Evidence export (last 48h audit log)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"evidence_export\",\"store_id\":\"$CERT_STORE_ID\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          ENTRIES=$(echo "$BODY" | jq -r '.total_entries // 0' 2>/dev/null || echo "?")
          WINDOW=$(echo "$BODY" | jq -r '.window // "?"' 2>/dev/null || echo "?")
          ACTIONS=$(echo "$BODY" | jq -r '.by_action | keys | join(", ")' 2>/dev/null || echo "?")
          echo "D3-005 evidence_export: HTTP $HTTP_CODE"
          echo "  total_entries: $ENTRIES"
          echo "  window: $WINDOW"
          echo "  actions: $ACTIONS"
          echo "D3005_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "D3005_ENTRIES=$ENTRIES" >> $GITHUB_ENV

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANIEL }}
        run: |
          MSG="*UBER Day 3 - Scope Probe %2B Delivery APIs*%0A%0A"
          MSG="${MSG}D3-001 health: $D3001_HTTP $D3001_BODY%0A"
          MSG="${MSG}D3-002 scope_probe: $D3002_HTTP%0A"
          MSG="${MSG}  granted: $D3002_GRANTED%0A"
          MSG="${MSG}  delta: $D3002_DELTA%0A"
          MSG="${MSG}  corr: $D3002_CORR%0A"
          MSG="${MSG}D3-003 reauth_url: $D3003_HTTP%0A"
          MSG="${MSG}D3-004 day3_full: $D3004_HTTP%0A"
          MSG="${MSG}  store_apis: $D3004_STORE_APIS%0A"
          MSG="${MSG}  real_order: $D3004_REAL_ORDER%0A"
          MSG="${MSG}  run_id: $D3004_RUN_ID%0A"
          MSG="${MSG}D3-005 evidence: $D3005_HTTP ($D3005_ENTRIES entries)%0A%0A"
          MSG="${MSG}Ticket: %23D5FEA8 - NO certified hasta respuesta Uber"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID&text=$MSG&parse_mode=Markdown" > /dev/null
