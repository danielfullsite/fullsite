name: UBER Day 3 — Scope Probe + Delivery APIs + Fresh Evidence

on:
  workflow_dispatch:

jobs:
  day3:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://app.fullsite.mx
      INTEGRATION_ADMIN_SECRET: ${{ secrets.INTEGRATION_ADMIN_SECRET }}
      CERT_STORE_ID: 633b57d4-237a-5a32-b249-7ceb795f1d35

    steps:
      - name: D3-001 — Health check (deploy Ready)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" "$APP_URL/api/integrations/uber-eats/webhook")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "D3-001 health: HTTP $HTTP_CODE — $BODY"
          echo "D3001_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "D3001_BODY=$BODY" >> $GITHUB_ENV

      - name: D3-002 — Scope probe (granted vs requested delta)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"scope_probe\",\"store_id\":\"$CERT_STORE_ID\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "D3-002 scope_probe: HTTP $HTTP_CODE"
          echo "$BODY" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('scopes_granted:', d.get('scopes_granted'))
  print('scopes_delta:', d.get('scopes_delta'))
  b=d.get('scope_blocker')
  if b: print('BLOCKER:', b.get('summary'))
  print('corr_id:', d.get('correlation_id'))
except: print('parse error:', sys.stdin.read())
" 2>/dev/null || true
          echo "D3002_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "D3002_BODY=$BODY" >> $GITHUB_ENV

      - name: D3-003 — Re-auth URL (USL with expanded scopes)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"reauth_url\",\"store_id\":\"$CERT_STORE_ID\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          echo "D3-003 reauth_url: HTTP $HTTP_CODE (URL not logged — contains secrets)"
          echo "D3003_HTTP=$HTTP_CODE" >> $GITHUB_ENV

      - name: D3-004 — Delivery Store APIs (day3_full — phases 1+2)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"day3_full\",\"store_id\":\"$CERT_STORE_ID\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "D3-004 day3_full: HTTP $HTTP_CODE"
          echo "$BODY" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  s=d.get('summary',{})
  print('delivery_store_apis:', s.get('delivery_store_apis'))
  print('internal_pipeline:', s.get('internal_pipeline'))
  print('real_order:', s.get('real_order'))
  print('uber_evidence_status:', s.get('uber_evidence_status'))
  print('day3_run_id:', d.get('day3_run_id'))
except: print(sys.stdin.read()[:500])
" 2>/dev/null || true
          echo "D3004_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "D3004_BODY=$BODY" >> $GITHUB_ENV

      - name: D3-005 — Evidence export (last 48h audit log)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"evidence_export\",\"store_id\":\"$CERT_STORE_ID\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "D3-005 evidence_export: HTTP $HTTP_CODE"
          echo "$BODY" | python3 -c "
import sys,json
try:
  d=json.load(sys.stdin)
  print('total_entries:', d.get('total_entries'))
  print('window:', d.get('window'))
  print('actions_found:', list(d.get('by_action',{}).keys()))
except: print(sys.stdin.read()[:300])
" 2>/dev/null || true
          echo "D3005_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          ENTRY_COUNT=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('total_entries',0))" 2>/dev/null || echo "?")
          echo "D3005_ENTRY_COUNT=$ENTRY_COUNT" >> $GITHUB_ENV

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANIEL }}
        run: |
          MSG="*UBER Day 3 — Scope Probe %2B Delivery APIs %2B Evidence*%0A%0A"
          MSG="${MSG}D3-001 health: $D3001_HTTP $D3001_BODY%0A"
          MSG="${MSG}D3-002 scope_probe: $D3002_HTTP%0A"
          MSG="${MSG}D3-003 reauth_url: $D3003_HTTP%0A"
          MSG="${MSG}D3-004 day3_full: $D3004_HTTP%0A"
          MSG="${MSG}D3-005 evidence_export: $D3005_HTTP ($D3005_ENTRY_COUNT entries)%0A%0A"
          MSG="${MSG}Ticket: %23D5FEA8 — NO certified hasta respuesta Uber"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID&text=$MSG&parse_mode=Markdown" > /dev/null
