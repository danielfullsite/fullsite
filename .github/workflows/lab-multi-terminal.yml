name: Laboratorio multi-terminal (Caja + POS 2 + POS 3 + KDS)

# OTRO LABORATORIO QUE EXISTIA Y NADIE CORRIA.
#
# `electron-app/lab/` tiene seis laboratorios y NINGUN workflow ejecutaba uno solo.
# Es el mismo patron que ya costo caro dos veces esta semana: `offline-e2e.yml` nacio
# con la frase "LA PRUEBA YA EXISTIA. NADIE LA CORRIA.", y el 2026-09-09 aparecieron
# 33 casos huerfanos en `dashboard-app/tests/` que ningun runner miraba.
#
# ── POR QUE ESTE, Y POR QUE ESTE PRIMERO ─────────────────────────────────────
#
# `laboratorio-multi-terminal.cjs` levanta CUATRO PROCESOS ELECTRON DE VERDAD —Caja,
# POS 2, POS 3 y KDS— cada uno con su carpeta, su puerto y su rol, hablandose solo por
# HTTP y WebSocket. Es lo mas cerca del restaurante que se puede llegar sin ir.
#
# Y comprueba justo el defecto de campo del 2026-09-02 (Eduardo, AMALAY, tres cajas):
# «no hay comunicacion correcta entre los puntos de venta». La asercion se llama
# "POS 2 VE la comanda que nacio en POS 3 (el defecto de campo, cerrado)".
#
# Tarda 3.2 segundos. Las pruebas de `local-server/tests/` levantan varios Pedro dentro
# de UN proceso: eso demuestra el protocolo y esconde tres cosas que solo aparecen con
# procesos separados —que no comparten `userData`, que no chocan de puerto, y que el
# arranque real de Electron enciende lo que toca segun el rol.
#
# ── LO QUE ESTE WORKFLOW NO HACE ─────────────────────────────────────────────
#
# No certifica nada. La matriz offline (docs/offline/TEST-MATRIX.md) pide ejecucion
# fisica para la columna Cert, y sigue en 0 de 21. Esto mueve la columna Test, que es
# lo que un servidor de integracion puede mover.
#
# El laboratorio de UI se ejecuta en un job separado: compilar Next en frío
# necesita más presupuesto que verificar el protocolo entre procesos.

on:
  pull_request:
    paths:
      - 'electron-app/local-server/**'
      - 'electron-app/main.js'
      - 'electron-app/lab/**'
      - 'dashboard-app/src/**'
      - 'supabase/migrations/**'
      - '.github/workflows/lab-multi-terminal.yml'
  push:
    branches: [main]
    paths:
      - 'electron-app/local-server/**'
      - 'electron-app/main.js'
  workflow_dispatch:

jobs:
  multi-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: electron-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron-app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Electron necesita un display aunque no se abra ninguna ventana util: sin esto
      # el proceso muere al arrancar y el fallo se lee como "Pedro no escucha", que
      # manda a buscar el defecto al lado equivocado.
      - name: Instalar xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # EL SANDBOX SE ARREGLA, NO SE APAGA.
      #
      # `npm ci` no puede poner setuid, asi que `chrome-sandbox` queda del usuario del
      # runner y Electron aborta antes de ejecutar una sola linea nuestra:
      #
      #   FATAL:setuid_sandbox_host.cc(163) The SUID sandbox helper binary was found,
      #   but is not configured correctly ... owned by root and has mode 4755
      #
      # Costo una corrida entera, y el sintoma en el log del laboratorio era
      # "FAIL caja: Pedro escucha en 7931" — o sea, el lado equivocado. Por eso el paso
      # de evidencia de abajo existe: los `*.log` traian la causa exacta.
      #
      # Lo obvio seria `--no-sandbox`. No: en las terminales del restaurante el sandbox
      # esta ENCENDIDO, y una prueba que lo apaga deja de probar lo que corre en campo.
      # Es el arreglo que documenta Electron.
      - name: Habilitar el sandbox de Electron
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Pruebas del servidor local
        run: node --test local-server/tests/*.test.js

      - name: Cuatro terminales, cuatro procesos
        run: xvfb-run --auto-servernum node lab/laboratorio-multi-terminal.cjs

      - name: Guardar evidencia del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-multi-terminal-logs
          path: /tmp/lab-multi-*
          if-no-files-found: ignore
          retention-days: 7


  ui-multi-terminal:
    strategy:
      fail-fast: false
      matrix:
        mode: [legacy, caja]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            electron-app/package-lock.json
            dashboard-app/package-lock.json
      - run: npm ci
        working-directory: electron-app
      - run: npm ci
        working-directory: dashboard-app
      - name: Instalar dependencias del navegador
        run: npx playwright install-deps chromium
        working-directory: dashboard-app
      - name: Preparar display y sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sudo chown root:root electron-app/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 electron-app/node_modules/electron/dist/chrome-sandbox
      - name: Recorrer POS y KDS desde las pantallas reales
        run: xvfb-run --auto-servernum node electron-app/lab/laboratorio-ui-multiterminal.cjs
        env:
          CI: 'true'
          FULLSITE_LAB_OPERATIONAL: ${{ matrix.mode == 'caja' && '1' || '0' }}
          FULLSITE_LAB_PRINT: ${{ matrix.mode == 'caja' && '1' || '0' }}
      - name: Conservar resultados y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-ui-multi-terminal-${{ matrix.mode }}-evidence
          path: output/closure/ui*/
          retention-days: 14

  transfer-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probar transferencia en PostgreSQL temporal
        run: node electron-app/lab/run-transfer-item-local.cjs
      - name: Probar aislamiento de proxy y tablas hijas en PostgreSQL temporal
        run: node electron-app/lab/run-scoped-upsert-local.cjs
      - name: Probar movimientos y cancelaciones de inventario en PostgreSQL temporal
        run: |
          node electron-app/lab/run-inventory-movement-local.cjs
          node electron-app/lab/run-inventory-reconcile-local.cjs
      - name: Instalar runtime del materializador
        run: npm ci
        working-directory: electron-app
      - name: Probar recibos de negocio en PostgreSQL temporal
        run: node electron-app/lab/run-materializador-local.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-postgres-evidence
          path: |
            output/closure/transfer-item
            output/closure/materializer
            output/closure/scoped-upsert
            output/closure/inventory-movement
            output/closure/inventory-reconcile
