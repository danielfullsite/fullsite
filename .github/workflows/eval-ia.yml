name: Eval IA del dueño

# Exactitud MEDIDA de /api/chat contra verdad en SQL (docs/ai/IA-DEL-DUENO.md §3c).
# Groq real + Supabase de STAGING (tenant chickin-demo por defecto). No escribe nada en la
# base: las bitácoras del chat se interceptan y las consultas son de sólo lectura.
#
# SÓLO manual (workflow_dispatch). No corre en pull_request a propósito: un PR podría
# cambiar el código que se ejecuta con la service key de staging.
#
# Environment `eval-staging` (Settings → Environments), con revisores requeridos: cada
# corrida espera aprobación antes de recibir los secrets. Secrets DEL ENVIRONMENT:
#   SUPABASE_URL_STAGING           — URL del proyecto de staging
#   SUPABASE_SERVICE_KEY_STAGING   — service_role de staging
#   GROQ_API_KEY                   — (o el del repo, que ya existe)
# (Los SUPABASE_URL / SUPABASE_SERVICE_KEY del repo son de producción: no se usan aquí.)
#
# Falla si la exactitud < umbral (0.9), si una trampa falla (dato inventado) o si >10% de
# las preguntas no tuvo respuesta del chat. El reporte (artifact, 7 días) no trae datos del
# restaurante: sólo aprobado/fallido, números esperado vs obtenido, latencia, consultas y
# clase de error.

on:
  workflow_dispatch:
    inputs:
      solo:
        description: 'Sólo estas preguntas (prefijos de id o categorías: simple,cruce,trampa,fechas), separadas por coma'
        required: false
        default: ''
      umbral:
        description: 'Exactitud mínima (0..1)'
        required: false
        default: '0.9'
      tenant:
        description: 'Tenant de staging'
        required: false
        default: 'chickin-demo'

concurrency:
  group: eval-ia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: dashboard-app

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Aprobación requerida antes de exponer la service key de staging.
    environment: eval-staging
    env:
      EVAL_IA_SUPABASE_URL: ${{ secrets.SUPABASE_URL_STAGING }}
      EVAL_IA_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY_STAGING }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      EVAL_IA_TENANT: ${{ inputs.tenant || 'chickin-demo' }}
      EVAL_IA_UMBRAL: ${{ inputs.umbral || '0.9' }}
      EVAL_IA_SOLO: ${{ inputs.solo || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json

      - name: Secrets de staging
        run: |
          faltan=""
          [ -n "$EVAL_IA_SUPABASE_URL" ] || faltan="$faltan SUPABASE_URL_STAGING"
          [ -n "$EVAL_IA_SUPABASE_SERVICE_KEY" ] || faltan="$faltan SUPABASE_SERVICE_KEY_STAGING"
          [ -n "$GROQ_API_KEY" ] || faltan="$faltan GROQ_API_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets para la eval IA:$faltan (ver docs/ai/IA-DEL-DUENO.md §3c)"
            exit 1
          fi

      - run: npm ci

      - name: Eval de exactitud
        run: npm run eval:ia

      - name: Resumen
        if: always()
        run: |
          f=$(ls -t evals/ia/resultados/*.md 2>/dev/null | head -1)
          if [ -n "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "Sin reporte (la eval no llegó a correr)." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-ia-${{ github.run_id }}
          path: |
            dashboard-app/evals/ia/resultados/*.md
            dashboard-app/evals/ia/resultados/*.json
          if-no-files-found: ignore
          retention-days: 7
