name: Build Electron POS (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'electron-app/**'
      - 'dashboard-app/**'
      - '.github/workflows/electron-build.yml'
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            electron-app/package-lock.json
            dashboard-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install POS UI dependencies
        working-directory: dashboard-app
        run: npm ci

      # Browser configuration only. No service role, PIN, LAN or branch config
      # belongs in this build. Missing values fail the build before packaging.
      - name: Build complete offline POS UI
        run: npm run build:ui
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fullsite-pos-win-${{ github.sha }}
          path: electron-app/dist/*.exe
          retention-days: 30
