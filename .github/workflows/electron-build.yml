name: Build Electron POS (Windows)

on:
  push:
    branches: [main]
    paths:
      - 'electron-app/**'
      - 'dashboard-app/**'
      - '.github/workflows/electron-build.yml'
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            electron-app/package-lock.json
            dashboard-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install POS UI dependencies
        working-directory: dashboard-app
        run: npm ci

      # LAS DOS VARIABLES QUE HACEN QUE ESTE BUILD EXISTA O NO.
      #
      # Verificado el 2026-09-08: no hay NINGUNA variable de repositorio configurada, y
      # este paso —que solo existe en esta rama, main no lo tiene— nunca habia corrido en
      # CI. O sea que el candidato NUNCA se ha podido construir aqui, y nadie lo sabia
      # porque nadie habia disparado el workflow. Por eso el unico portable que existe
      # (1.3.9, el que corre hoy en AMALAY) se armo a mano en una Mac.
      #
      # El script de abajo revienta con un stack trace de Node que no dice que hacer. Esta
      # guarda convierte eso en una instruccion.
      - name: Comprobar la configuracion publica del build
        shell: bash
        run: |
          faltan=()
          [ -n "${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" ] || faltan+=(NEXT_PUBLIC_SUPABASE_URL)
          [ -n "${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] || faltan+=(NEXT_PUBLIC_SUPABASE_ANON_KEY)
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "::error::Faltan variables de repositorio: ${faltan[*]}"
            echo ""
            echo "Este build no puede producir una interfaz utilizable sin ellas: Next las"
            echo "inlinea en el paquete y NO se pueden poner despues de instalar."
            echo ""
            echo "Son configuracion PUBLICA de navegador — la URL y la anon key, las mismas"
            echo "que ya viajan en cualquier pagina del dashboard. Van como variables, no"
            echo "como secretos. Para ponerlas:"
            echo ""
            echo "  gh variable set NEXT_PUBLIC_SUPABASE_URL      --body '<url>'"
            echo "  gh variable set NEXT_PUBLIC_SUPABASE_ANON_KEY --body '<anon key>'"
            echo ""
            echo "NO poner aqui la service key ni ningun PIN, secreto de LAN o config de"
            echo "sucursal: este paquete se instala en las terminales del restaurante."
            exit 1
          fi
          echo "Configuracion publica presente."

      # Browser configuration only. No service role, PIN, LAN or branch config
      # belongs in this build. Missing values fail the build before packaging.
      - name: Build complete offline POS UI
        run: npm run build:ui
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # LAS PRUEBAS CORREN EN WINDOWS, ANTES DE CONSTRUIR.
      #
      # Hasta hoy este workflow compilaba el instalador sin ejecutar una sola prueba: las
      # 457 del local-server solo habian corrido en una Mac. Ese codigo vive de cosas que
      # en macOS no existen — rutas C:\fullsite\, separadores, spawn de un .exe, CRLF,
      # puertos ocupados. Un instalador que compila no es un instalador que funciona, y
      # antes de la visita a AMALAY esa distincion es la que importa.
      #
      # Van ANTES del build a proposito: si algo falla aqui, no queremos un .exe esperando
      # en los artefactos a que alguien lo lleve a una caja.
      # EN BASH, NO EN POWERSHELL, y no es cosmetico: el paso por defecto corre en pwsh,
      # que no expande el glob entre comillas, y `node --test` tampoco lo expande en
      # Windows (en macOS/Linux lo hace el shell). El resultado fue, la primera vez que
      # este paso llego a ejecutarse (2026-09-09, run 34317547583):
      #
      #     Could not find 'D:\a\...\electron-app\local-server\tests\*.test.js'
      #
      # Se usa bash --que windows-latest trae-- para que el glob se expanda igual que en
      # la maquina de quien desarrolla: 53 archivos, 503 pruebas, el mismo conjunto.
      #
      # `node --test` a secas tambien descubre esos mismos 53 (comprobado, no supuesto),
      # asi que serviria igual. Se prefiere el glob explicito porque deja escrito QUE se
      # corre: el dia que alguien agregue un runner que arranque procesos reales, el
      # descubrimiento automatico se lo llevaria sin avisar y este paso no.
      - name: Pruebas del local-server en Windows
        shell: bash
        run: node --test local-server/tests/*.test.js

      - name: Sellar el commit del candidato
        run: npm run sellar

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --publish never

      - name: Verificar identidad dentro del ejecutable
        shell: bash
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict')
          const asar = require('@electron/asar')
          const archive = 'dist/win-unpacked/resources/app.asar'
          const info = JSON.parse(asar.extractFile(archive, 'build-info.json'))
          assert.equal(info.sha, process.env.GITHUB_SHA)
          assert.equal(info.limpio, true)
          assert.equal(info.version, require('./package.json').version)
          console.log(`Paquete identificado: ${info.version} · ${info.sha}`)
          JS

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fullsite-pos-win-${{ github.sha }}
          path: electron-app/dist/*.exe
          retention-days: 30

      # LA CARPETA PORTABLE, que es como se prueba sin arriesgar la caja.
      #
      # En AMALAY no corre una instalacion: corre una PORTABLE. Verificado el 2026-09-08 en
      # SERVER1 — C:\fullsite\Fullsite-POS-1.3.9-x64-portable\win-unpacked, y el
      # __MACOSX que trae al lado delata que ese zip se comprimio a mano en una Mac.
      #
      # Eso hace que probar una version nueva sea de riesgo casi cero: se deja la carpeta
      # nueva junto a la vieja, se abre, y si algo falla se cierra y se vuelve a abrir la
      # anterior. La vuelta atras es borrar una carpeta, no desinstalar.
      #
      # `win-unpacked` ya lo produce electron-builder como paso intermedio del instalador;
      # solo faltaba subirlo. No cuesta un build extra.
      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: fullsite-pos-portable-${{ github.sha }}
          path: electron-app/dist/win-unpacked/**
          retention-days: 30
