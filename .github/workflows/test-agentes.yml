name: Agentes — Pruebas

# SIN filtro `paths`, por la misma razón que Dashboard Tests: un check que sólo
# reporta a veces no sirve como check requerido. El costo aquí es de segundos —
# no hay red, no hay dependencias, sólo se lee el AST de los scripts.
#
# Para que esto BLOQUEE de verdad hay que agregar el contexto `agentes` a la
# protección de rama de main. Mientras no esté, avisa pero no detiene.
on:
  push:
  pull_request:

jobs:
  agentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }

      # `agent_results.data` es jsonb. Un agente que mande json.dumps({...}) guarda
      # un escalar de tipo string y deja el dato inconsultable desde SQL
      # (`data->>'campo'` devuelve NULL) sin romper nada visible en el dashboard.
      # Es un fallo silencioso: por eso se atrapa aquí y no en producción.
      - run: python .github/scripts/test_agent_results_jsonb.py

      # El turno del simulador. `demo-24-7.yml` también corre esta prueba, pero ese
      # workflow sólo dispara por cron o a mano: un PR que rompiera `pos_turno.py` no
      # se enteraría hasta la siguiente corrida del demo, con las órdenes ya rechazadas.
      # Aquí corre en cada push. Sin red, como el resto.
      - run: python .github/scripts/test_pos_turno.py
      - run: python .github/scripts/test_identidad_de_renglon.py
      - run: python .github/scripts/test_pos_estaciones.py

      # Lo que `log_event` y `create_insight` le mandan a PostgREST. `cuadre.yml`
      # también corre esta prueba, pero sólo dispara a la 1am o a mano: un PR que
      # volviera a envolver `evidence` en json.dumps no se enteraría hasta la
      # siguiente corrida, con la evidencia ya escrita e inconsultable. Sin red.
      - run: python .github/scripts/test_log_event.py

      # Permisos en las migraciones. El 2026-09-09 se aplico desde `main` un
      # `grant select ... to anon` sobre una vista sin `security_invoker`: `anon` es la
      # llave publica y la vista se salta el RLS, asi que publicó 148 filas de 3
      # restaurantes. El arreglo ya existia en un PR sin mergear — el archivo con el
      # hueco seguia en main, y de ahi se aplico. Esto lo atrapa en el PR. Sin red.
      - run: python .github/scripts/test_migraciones_no_exponen_a_anon.py
