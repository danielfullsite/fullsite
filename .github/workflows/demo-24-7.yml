# El restaurante demo, vivo a toda hora.
#
# PARA QUÉ
# Un demo que se le enseña a un prospecto tiene que tener datos de hoy, sin importar a
# qué hora caiga la junta. Y sirve de banco de pruebas para afinar los agentes con datos
# que se mueven, en vez de esperar a que un restaurante real genere volumen.
#
# EN QUÉ SE DIFERENCIA DEL LAB
# `lab-24-7` genera el MISMO volumen a toda hora. Por eso lab-resto tiene 109 órdenes a
# las 4 de la mañana y sólo 3 a las 6 de la tarde (medido 2026-08-26): un restaurante que
# nunca cierra y que está muerto en la cena. Para un laboratorio da igual; para un demo
# es lo primero que un restaurantero nota que está mal.
#
# Aquí se enciende CURVA_HORARIA: cerrado de 00:00 a 07:00, pico de comida a las 13–14 y
# pico de cena a las 19–21. La curva viene apagada por omisión, así que el lab existente
# no se toca.
#
# COSTO
# ~20 segundos por corrida, cada hora → unos 250 minutos de Actions al mes. El simulador
# es Python puro, sin llamadas a Groq: de los 71 scripts sólo 6 usan LLM, y ninguno es
# éste. Prácticamente gratis.
#
# PROBAR FUERA DE HORARIO
# Un disparo manual a las 3 de la mañana cae en la franja cerrada de la curva y termina
# en verde sin crear nada. Para eso está el input `forzar_horario`: apaga la curva SÓLO
# en esa corrida, sin tocar el cron.
#
# CÓMO APAGARLO
# Actions → este workflow → "..." → Disable workflow. Nada más depende de él.

name: Demo — restaurante vivo 24/7

on:
  schedule:
    - cron: '5 * * * *'      # cada hora, en el minuto 5
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Tenant a simular'
        required: false
        default: 'demo'
      forzar_horario:
        description: 'Ignorar la curva horaria (para probar fuera de servicio)'
        type: boolean
        required: false
        default: false

concurrency:
  # Que dos corridas no escriban órdenes encima. Sin esto, un retraso de GitHub puede
  # encimar la corrida de las 14:05 con la de las 15:05 y duplicar el volumen.
  group: demo-24-7
  cancel-in-progress: false

jobs:
  simular:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ github.event.inputs.client_id || 'demo' }}
      # El cron la deja encendida — el demo tiene que verse como un restaurante.
      #
      # `forzar_horario` la apaga SÓLO en la corrida manual. Sin eso, un disparo a mano
      # fuera de servicio cae en la franja cerrada (00–06 vale 0.0), termina en `success`
      # con "+0 órdenes, 0 a cocina, 0 cobradas" y no ejercita nada: verde en vacío. Eso
      # impidió verificar el descuento de inventario el 2026-09-09.
      #
      # En el cron `github.event.inputs` es nulo, así que la comparación es falsa y la
      # curva queda en '1'. lab_simulator.py trata como apagado todo lo que no sea
      # 1/true/si/sí, por eso basta con '0'.
      CURVA_HORARIA: ${{ github.event.inputs.forzar_horario == 'true' && '0' || '1' }}
      TZ_LOCAL: 'America/Monterrey'
      # Por el camino real del POS: PIN -> shift token -> api/pos/save-order.
      #
      # Escribir directo a pos_orders se salta el descuento de inventario, la
      # concurrencia por revision, la deteccion de skimming y la validacion de pagos.
      # Medido el 2026-08-26: el 100% de las ordenes cerradas del laboratorio (2,813 de
      # 2,813 en lab-resto) serian RECHAZADAS por el POS real.
      #
      # Sin POS_PIN el paso falla con un mensaje que lo explica, en vez de escribir mal.
      VIA_POS: '1'
      POS_PIN: ${{ secrets.DEMO_POS_PIN }}
      APP_URL: 'https://app.fullsite.mx'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TRIGGER_TYPE: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install requests

      - name: No tocar un restaurante real por accidente
        run: |
          # El simulador ESCRIBE órdenes. Apuntarlo a un tenant real le inventaría
          # ventas que nunca ocurrieron: números falsos en el dashboard de alguien que
          # paga. La lista blanca es corta a propósito.
          case "$CLIENT_ID" in
            demo|lab-resto|esqueleton-demo) echo "Tenant de pruebas: $CLIENT_ID" ;;
            *) echo "::error::$CLIENT_ID no es un tenant de pruebas. El simulador NO escribe en restaurantes reales."
               exit 1 ;;
          esac

      - run: python .github/scripts/test_curva_horaria.py
      - run: python .github/scripts/test_menu_del_tenant.py
      - run: python .github/scripts/test_pos_client.py

      - name: Comprobar que el PIN esta puesto
        run: |
          if [ -z "$POS_PIN" ]; then
            echo "::error::Falta el secreto DEMO_POS_PIN. El simulador entra al POS como"
            echo "una terminal real (PIN -> shift token). Agregalo en Settings -> Secrets"
            echo "and variables -> Actions. Es el PIN de un empleado del tenant demo."
            exit 1
          fi

      - name: El forzado llego a la variable
        if: github.event.inputs.forzar_horario == 'true'
        run: |
          # Si la expresion del `env:` se rompiera, la corrida forzada volveria a salir
          # verde sin crear nada — el bug que este input existe para evitar. Mejor tronar.
          if [ "$CURVA_HORARIA" != "0" ]; then
            echo "::error::forzar_horario=true pero CURVA_HORARIA='$CURVA_HORARIA'."
            echo "::error::La corrida habria respetado la curva y creado 0 ordenes."
            exit 1
          fi
          echo "Curva forzada a apagada para esta corrida."

      - name: Simular el servicio
        run: |
          # `pipefail` explicito: el shell por omision de Actions es `bash -e {0}`, SIN
          # pipefail. Sin esta linea, `| tee` devuelve el codigo de tee (0) y un simulador
          # que truena saldria en verde con el error escondido en el log — la misma clase
          # de falso verde que este PR corrige.
          set -o pipefail
          python .github/scripts/lab_simulator.py | tee /tmp/lab-simulator.log

      - name: Resumen
        if: always()
        run: |
          if [ "$CURVA_HORARIA" = "1" ]; then
            modo="curva horaria activa (zona $TZ_LOCAL)"
          else
            modo="curva horaria FORZADA a apagada — corrida de prueba fuera de servicio"
          fi
          echo "Tenant: \`$CLIENT_ID\` · $modo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # La cuenta de órdenes sólo vivía en el log del simulador. Subirla al resumen es
          # lo que deja ver de un vistazo si la corrida ejercitó algo o salió verde en vacío.
          grep -F 'órdenes,' /tmp/lab-simulator.log 2>/dev/null | tail -1 >> "$GITHUB_STEP_SUMMARY" || true
