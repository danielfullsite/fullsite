name: UBER Cert Close - sandbox order + resolve fulfillment

# Cierra los 2 endpoints recomendados de Uber (case #59731873):
#  - Resolve for Fulfillment Issues (usa GET /v1/delivery/order/{id}?expand=carts, PR #347)
#  - (Scheduled se valida recibiendo el webhook; no requiere este workflow)
#
# Modo A (sin order_id): intenta crear una orden sandbox de delivery vía Uber.
# Modo B (con order_id, de una orden real colocada en el consumer app): get -> accept -> resolve.

on:
  workflow_dispatch:
    inputs:
      order_id:
        description: "order_id real de una orden colocada en el sandbox (deja vacío para intentar crear una)"
        required: false
        default: ""
      item_name:
        description: "nombre del item para el resolve (default Cafe Americano)"
        required: false
        default: "Cafe Americano"

jobs:
  close:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://app.fullsite.mx
      INTEGRATION_ADMIN_SECRET: ${{ secrets.INTEGRATION_ADMIN_SECRET }}
      STORE: a4f298f4-202f-47f5-b375-d2eefec0126c
      ORDER_IN: ${{ github.event.inputs.order_id }}
      ITEM_NAME: ${{ github.event.inputs.item_name }}

    steps:
      - name: Health check
        run: |
          curl -s -w "\nHTTP %{http_code}\n" "$APP_URL/api/integrations/uber-eats/webhook"

      - name: Activate store (status ONLINE — requisito de Testing Orders "store Open")
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" -H "Content-Type: application/json" \
            -d "{\"action\":\"delivery_store_activate\",\"store_id\":\"$STORE\"}")
          echo "activate HTTP $(echo "$RESP" | tail -1)"; echo "$RESP" | head -n -1

      - name: Get store status
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" -H "Content-Type: application/json" \
            -d "{\"action\":\"delivery_store_status\",\"store_id\":\"$STORE\"}")
          echo "status HTTP $(echo "$RESP" | tail -1)"; echo "$RESP" | head -n -1

      - name: Attempt sandbox order creation (solo si no se pasó order_id)
        if: ${{ github.event.inputs.order_id == '' }}
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" -H "Content-Type: application/json" \
            -d "{\"action\":\"delivery_sandbox_order\",\"store_id\":\"$STORE\"}")
          CODE=$(echo "$RESP" | tail -1); BODY=$(echo "$RESP" | head -n -1)
          echo "sandbox_order HTTP $CODE"; echo "$BODY"
          OID=$(echo "$BODY" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("created_order_id") or "")' 2>/dev/null || echo "")
          echo "ORDER=$OID" >> $GITHUB_ENV

      - name: Resolve ORDER from input or created
        run: |
          ORDER="${ORDER_IN}"
          if [ -z "$ORDER" ]; then ORDER="${ORDER}"; fi
          # ORDER_IN wins; else the env ORDER set by the previous step
          FINAL="${ORDER_IN:-$ORDER}"
          echo "FINAL_ORDER=$FINAL" >> $GITHUB_ENV
          echo "order a usar: '${FINAL:-<ninguna>}'"

      - name: Get order details
        if: ${{ env.FINAL_ORDER != '' }}
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" -H "Content-Type: application/json" \
            -d "{\"action\":\"delivery_order_get\",\"store_id\":\"$STORE\",\"order_id\":\"$FINAL_ORDER\"}")
          echo "get HTTP $(echo "$RESP" | tail -1)"; echo "$RESP" | head -n -1

      - name: Accept order (idempotente)
        if: ${{ env.FINAL_ORDER != '' }}
        continue-on-error: true
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" -H "Content-Type: application/json" \
            -d "{\"action\":\"delivery_order_accept\",\"store_id\":\"$STORE\",\"order_id\":\"$FINAL_ORDER\"}")
          echo "accept HTTP $(echo "$RESP" | tail -1)"; echo "$RESP" | head -n -1

      - name: Resolve fulfillment (?expand=carts)
        if: ${{ env.FINAL_ORDER != '' }}
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" -H "Content-Type: application/json" \
            -d "{\"action\":\"resolve_fulfillment\",\"store_id\":\"$STORE\",\"order_id\":\"$FINAL_ORDER\",\"item_name\":\"$ITEM_NAME\"}")
          CODE=$(echo "$RESP" | tail -1); BODY=$(echo "$RESP" | head -n -1)
          echo "=== RESOLVE HTTP $CODE ==="; echo "$BODY"
          echo "$BODY" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("cart_item_id:", d.get("cart_item_id"), "| http_status:", d.get("http_status"))' 2>/dev/null || true
