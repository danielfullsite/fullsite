name: UBER-009 Simulate Test Order

on:
  workflow_dispatch:

jobs:
  simulate-order:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://app.fullsite.mx
      INTEGRATION_ADMIN_SECRET: ${{ secrets.INTEGRATION_ADMIN_SECRET }}

    steps:
      - name: Trigger sandbox order via Fullsite endpoint
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"store_id":"633b57d4-237a-5a32-b249-7ceb795f1d35"}')

          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          echo "Body: $BODY"
          echo "ORDER_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "ORDER_BODY=$BODY" >> $GITHUB_ENV

          if [ "$HTTP_CODE" = "200" ]; then
            echo "ORDER_RESULT=PASS" >> $GITHUB_ENV
          else
            echo "ORDER_RESULT=FAIL_$HTTP_CODE" >> $GITHUB_ENV
          fi

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANIEL }}
        run: |
          MSG="*UBER-009 Simulate Order*%0A%0AResult: $ORDER_RESULT%0AHTTP: $ORDER_HTTP%0ABody: $ORDER_BODY"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID&text=$MSG&parse_mode=Markdown" > /dev/null
