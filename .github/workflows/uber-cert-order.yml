name: UBER-009 Simulate Test Order

on:
  workflow_dispatch:

jobs:
  simulate-order:
    runs-on: ubuntu-latest
    env:
      UBER_CLIENT_ID: ${{ secrets.UBER_CLIENT_ID }}
      UBER_CLIENT_SECRET: ${{ secrets.UBER_CLIENT_SECRET }}
      STORE_ID: "633b57d4-237a-5a32-b249-7ceb795f1d35"
      SANDBOX_AUTH: "https://sandbox-login.uber.com/oauth/v2/token"
      SANDBOX_API: "https://test-api.uber.com"

    steps:
      - name: Get client_credentials token (no scope)
        run: |
          RESP=$(curl -s -X POST "$SANDBOX_AUTH" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=$UBER_CLIENT_ID&client_secret=$UBER_CLIENT_SECRET&grant_type=client_credentials")
          echo "Token response: $RESP"
          TOKEN=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          if [ -z "$TOKEN" ]; then
            echo "TOKEN_SCOPE_ERROR=1" >> $GITHUB_ENV
            # Try with eats.pos_provisioning scope
            RESP2=$(curl -s -X POST "$SANDBOX_AUTH" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "client_id=$UBER_CLIENT_ID&client_secret=$UBER_CLIENT_SECRET&grant_type=client_credentials&scope=eats.pos_provisioning")
            echo "Scoped response: $RESP2"
            TOKEN=$(echo "$RESP2" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token',''))")
          fi
          echo "UBER_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Create sandbox test order
        run: |
          if [ -z "$UBER_TOKEN" ]; then
            echo "No token — cannot create order"
            echo "ORDER_RESULT=NO_TOKEN" >> $GITHUB_ENV
            exit 0
          fi

          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$SANDBOX_API/v1/eats/sandbox/store/$STORE_ID/order" \
            -H "Authorization: Bearer $UBER_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"delivery"}')

          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          echo "Body: $BODY"
          echo "ORDER_HTTP=$HTTP_CODE" >> $GITHUB_ENV
          echo "ORDER_BODY=$BODY" >> $GITHUB_ENV

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "ORDER_RESULT=ORDER_SENT" >> $GITHUB_ENV
          else
            echo "ORDER_RESULT=FAILED_$HTTP_CODE" >> $GITHUB_ENV
          fi

      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_DANIEL }}
        run: |
          MSG="*UBER-009 Simulate Order*%0A%0AResult: $ORDER_RESULT%0AHTTP: $ORDER_HTTP%0ABody: $ORDER_BODY"
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d "chat_id=$TELEGRAM_CHAT_ID&text=$MSG&parse_mode=Markdown" > /dev/null
