name: Demo Live — Generador 24/7
on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min → restaurante "vivo"
  workflow_dispatch:
    inputs:
      client:
        description: "client_id del tenant demo-live"
        default: "demo-live"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python .github/scripts/demo_live_generator.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEMO_CLIENT: ${{ github.event.inputs.client || 'demo-live' }}
