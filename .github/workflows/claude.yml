name: Claude Code

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

# Minimal permissions — id-token and actions not required by Claude Code action
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  claude:
    runs-on: ubuntu-latest
    # Seguridad (2026-09-26, revisión independiente 9): el repo es público y cualquiera puede comentar.
    # Sólo quien ya tiene escritura dispara el job — control propio, no sólo el de la acción de terceros.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.body, '@claude'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          allowed_tools: >
            Bash(git *),
            Bash(npm *),
            Bash(node *),
            Bash(ls *),
            Bash(cat *),
            Bash(mkdir *),
            Bash(cp *),
            Bash(mv *),
            Bash(rm *),
            Bash(echo *),
            Bash(grep *),
            Bash(find *),
            Bash(sed *),
            Bash(awk *),
            Read,
            Write,
            Edit,
            Glob,
            Grep
          timeout_minutes: "60"
          custom_instructions: |
            After committing and pushing your changes, your job is done.
            Do NOT try to create PRs or run gh commands — the workflow handles that automatically after you finish.

      - name: Crear el PR de la rama de ESTE issue y pedir auto-merge (espera la CI)
        if: github.event_name == 'issue_comment' || github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Antes se tomaba la `claude/*` ÚLTIMA EN ORDEN ALFABÉTICO (sort -k3 -r), que podía ser trabajo
          # en curso de otra sesión (hay ramas claude/* de Claude Code), y se hacía merge directo, sin
          # esperar la CI. Ahora: sólo la rama que la acción crea para este issue, y --auto.
          case "$ISSUE_NUMBER" in ''|*[!0-9]*) echo "::error::número de issue inválido"; exit 1 ;; esac
          BRANCH=$(git ls-remote --heads origin "claude/issue-${ISSUE_NUMBER}-*" | awk '{print $2}' | sed 's|refs/heads/||' | sort | tail -1)
          if [ -z "$BRANCH" ]; then
            echo "Sin rama claude/issue-${ISSUE_NUMBER}-*: no se crea PR"
            exit 0
          fi
          echo "Rama: $BRANCH"
          EXISTING_PR=$(gh pr list --repo "$REPO" --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$EXISTING_PR" ]; then
            gh pr create --repo "$REPO" --head "$BRANCH" --base main \
              --title "Claude: issue #${ISSUE_NUMBER}" \
              --body "PR automático de la rama \`$BRANCH\` (issue #${ISSUE_NUMBER}). Se integra sólo con los checks requeridos de main en verde."
          fi
          # Sin merge directo: auto-merge espera los checks requeridos de main (hoy `test`).
          gh pr merge "$BRANCH" --repo "$REPO" --auto --squash \
            || echo "::notice::auto-merge no disponible; el PR queda abierto para revisión humana"
