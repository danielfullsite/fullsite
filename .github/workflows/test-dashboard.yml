name: Dashboard Tests

# SIN filtro `paths` a propósito. `test` es el contexto REQUERIDO de la protección de
# rama de main. Con el filtro, un PR que no tocara dashboard-app/ nunca recibía el check
# y quedaba BLOCKED para siempre — le pasó a #66 (local-server) y le pasaría a cualquier
# PR de docs, workflows o electron-app. Un check requerido tiene que poder reportar
# SIEMPRE. El costo es ~1.5 min de CI por PR; el beneficio es que la protección de rama
# funciona en vez de ser una trampa.
on:
  push:
  pull_request:

defaults:
  run:
    working-directory: dashboard-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard-app/package-lock.json

      - run: npm ci

      # El guard de comandos vive en .claude/hooks/. Su suite corre DENTRO del check
      # requerido `test` a propósito: así un guard roto bloquea el merge sin inventar
      # un contexto nuevo que volvería ambiguo el check obligatorio.
      - name: Guard de comandos (suite)
        working-directory: .
        run: ./.claude/hooks/guard-bash.test.sh

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      # Pruebas de componente (jsdom). Van en su propio config para no
      # ralentizar la suite de Node, y en su propio paso para que una prueba
      # que nunca corre no pueda pasar por verde.
      - name: Component tests
        run: npm run test:ui
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
