name: UBER Activate - POST pos_data (associate app with location)

on:
  workflow_dispatch:
    inputs:
      store_id:
        description: 'Uber store_id a probar'
        required: true
        default: 'a4f298f4-202f-47f5-b375-d2eefec0126c'

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://app.fullsite.mx
      INTEGRATION_ADMIN_SECRET: ${{ secrets.INTEGRATION_ADMIN_SECRET }}
      STORE_ID: ${{ github.event.inputs.store_id }}

    steps:
      - name: A-001 - Scope probe (¿token guardado bajo este store? ¿accept_pos_order 404?)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"scope_probe\",\"store_id\":\"$STORE_ID\"}")
          echo "scope_probe: HTTP $(echo "$RESP" | tail -1)"
          echo "$RESP" | head -n -1 | jq '{p1_scopes: .phases.phase1_usl.scopes_granted_by_uber, p1_db: .phases.phase1_usl.db_status, p1_probe: .phases.phase1_usl.probe_accept_pos_order, p2_endpoint: .phases.phase2_marketplace.endpoint_probe}' 2>/dev/null || echo "$RESP" | head -n -1

      - name: A-002 - Test webhook (pipeline interno HMAC handler)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"test_webhook\",\"store_id\":\"$STORE_ID\"}")
          echo "test_webhook: HTTP $(echo "$RESP" | tail -1)"
          echo "$RESP" | head -n -1 | jq '.' 2>/dev/null || echo "$RESP" | head -n -1

      - name: A-003 - Sandbox order (intento crear orden real en Uber)
        run: |
          RESP=$(curl -s -w "\n%{http_code}" -X POST \
            "$APP_URL/api/integrations/uber-eats/sandbox" \
            -H "Authorization: Bearer $INTEGRATION_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"action\":\"delivery_sandbox_order\",\"store_id\":\"$STORE_ID\"}")
          echo "delivery_sandbox_order: HTTP $(echo "$RESP" | tail -1)"
          echo "$RESP" | head -n -1 | jq '.' 2>/dev/null || echo "$RESP" | head -n -1
