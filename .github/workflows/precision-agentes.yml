# Califica las predicciones de ayer contra lo que realmente pasó.
#
# Es la mitad que faltaba del ciclo. `resolve_event()` llevaba meses escrita en
# agent_common.py sin que la llamara nadie, y por eso al 2026-08-26 la base tenía 12
# eventos, CERO calificados, y 2,387 insights con `confidence` en NULL.
#
# Sin esto no hay número de precisión — ni bueno ni malo. No hay denominador.
#
# Corre a las 3am de Monterrey: el día ya cerró y las órdenes tardías ya entraron.

name: Precisión — calificar predicciones

on:
  schedule:
    - cron: '0 9 * * *'      # 09:00 UTC = 3am Monterrey
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Un restaurante, o ALL para todos'
        required: false
        default: 'ALL'

jobs:
  calificar:
    runs-on: ubuntu-latest

    # `python ... | tee salida.txt` sin pipefail reporta el codigo de salida de `tee`,
    # que siempre es 0. Los dos calificadores llevaban 7 dias fallando —uno con 500 y el
    # otro con un traceback— y GitHub marcaba verde todos los dias. El unico bucle que
    # mide la precision de este sistema estuvo muerto una semana sin que nada lo dijera.
    defaults:
      run:
        shell: bash -euo pipefail {0}

    env:
      CLIENT_ID: ${{ github.event.inputs.client_id || 'ALL' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TRIGGER_TYPE: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install requests

      # Las pruebas corren ANTES de calificar. Este script ESCRIBE el veredicto de
      # precisión: si su lógica está mal, ensucia el único número que vamos a usar
      # para decidir si los agentes sirven.
      - run: python .github/scripts/test_resolver_predicciones.py

      # Mismo criterio para el calificador de inventario: sus pruebas corren ANTES que él.
      # Un calificador con la lógica mal no produce un número malo — produce un número
      # falso, que es peor, porque se ve igual de bien que uno cierto.
      - run: python .github/scripts/test_resolver_inventario.py

      # Los dos calificadores son INDEPENDIENTES y los dos tienen que correr.
      #
      # Al poner pipefail (para que el fallo dejara de salir verde) introduje lo contrario:
      # con `bash -e`, el 500 de resolver_predicciones mataba el job y resolver_inventario
      # ya ni se ejecutaba. Cambié un fallo invisible por uno que bloquea. Lo encontró la
      # auditoría adversarial del 2026-09-08.
      #
      # `if: always()` hace que el segundo corra pase lo que pase, y como no lleva
      # continue-on-error el job SIGUE saliendo rojo si cualquiera de los dos falla. Ver y
      # bloquear no son lo mismo: aquí hace falta lo primero, no lo segundo.
      - name: Calificar predicciones
        run: python .github/scripts/resolver_predicciones.py | tee salida.txt

      - name: Calificar inventario
        if: always()
        run: python .github/scripts/resolver_inventario.py | tee -a salida.txt

      - name: Resumen
        if: always()
        run: |
          {
            echo '## Precisión de las predicciones'
            echo '```'
            cat salida.txt 2>/dev/null || echo 'sin salida'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
