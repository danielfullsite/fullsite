<meta charset="utf-8">
<title>Alta de restaurante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   ALTA DE RESTAURANTE — la plantilla vacía
   Dar de alta un cliente es llenar un objeto TENANT. Esta pantalla lo guía
   paso por paso, dice qué falta para poder operar, y al final entrega el
   objeto listo para pegar. Nada de esto toca código.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  color-scheme:dark;
  --bg:#080b0c; --surface:#0c1012; --surface-2:#11171a; --panel:#131a1d; --raised:#1a2226;
  --line:#232b2c; --line-soft:#191f20;
  --text-1:#eef2f0; --text-2:#a8b5b1; --text-3:#6f7d79; --text-4:#4a5553;
  --accent:#10b981; --accent-bright:#34d399;
  --accent-soft:rgba(16,185,129,.12); --accent-line:rgba(16,185,129,.28);
  --info:#38bdf8; --info-soft:rgba(56,189,248,.12); --info-line:rgba(56,189,248,.3);
  --warn:#f5a524; --warn-soft:rgba(245,165,36,.12); --warn-line:rgba(245,165,36,.3);
  --crit:#f5455c; --crit-soft:rgba(245,69,92,.12); --crit-ink:#fda4af; --crit-line:rgba(245,69,92,.32);
  --fs-green:#10B981;
  --r1:8px; --r2:12px; --r3:16px; --r4:22px;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 8px 24px rgba(0,0,0,.45);
  --ease:cubic-bezier(.2,.9,.3,1);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef1ec; --surface:#fff; --surface-2:#f4f7f1; --panel:#fff; --raised:#fff;
  --line:#dde3dc; --line-soft:#eef1ec;
  --text-1:#0e1613; --text-2:#3d4a46; --text-3:#6b7873; --text-4:#9aa5a1;
  --accent:#0ea371; --accent-soft:rgba(16,185,129,.1); --accent-line:rgba(5,120,90,.24);
  --shadow-1:0 1px 2px rgba(11,60,40,.1); --shadow-2:0 8px 24px rgba(11,60,40,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text-1);
  font-family:'Public Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;overflow:hidden;}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;}
input,select{font:inherit;color:inherit;}
code,.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

#app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;}

/* ── Barra superior con el progreso ─────────────────────────────────────── */
#top{display:flex;align-items:center;gap:16px;padding:0 20px;height:58px;
  background:var(--surface-2);border-bottom:1px solid var(--line);}
.brand{display:inline-flex;align-items:flex-end;gap:.07em;font-weight:800;
  letter-spacing:-.045em;font-size:18px;line-height:.9;}
.brand i{width:.22em;height:.22em;background:var(--fs-green);display:block;margin-bottom:.055em;}
#top .sep{width:1px;height:22px;background:var(--line);}
#top h1{margin:0;font-size:13.5px;font-weight:700;color:var(--text-3);}
#top .sp{flex:1;}
.icon-btn{width:38px;height:38px;border-radius:var(--r1);display:grid;place-items:center;color:var(--text-2);}
.icon-btn:hover{background:var(--surface);color:var(--text-1);}

.pasos{display:flex;gap:5px;overflow-x:auto;padding:0 2px;}
.paso{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 13px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);white-space:nowrap;
  font-size:12.5px;font-weight:700;color:var(--text-3);transition:.15s var(--ease);
}
.paso:active{transform:scale(.96);}
.paso .n{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  background:var(--line);color:var(--text-3);font-size:10.5px;font-weight:900;
  font-family:'IBM Plex Mono',monospace;flex-shrink:0;transition:.15s var(--ease);}
.paso[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-bright);}
.paso[aria-current="true"] .n{background:var(--accent);color:#052018;}
.paso.listo .n{background:var(--accent);color:#052018;}
.paso.listo{color:var(--text-2);}

/* ── Cuerpo ─────────────────────────────────────────────────────────────── */
#cuerpo{overflow-y:auto;overscroll-behavior:contain;}
.wrap{max-width:940px;margin:0 auto;padding:30px 22px 40px;}
.wrap.ancho{max-width:1180px;}
h2{margin:0 0 5px;font-size:25px;font-weight:900;letter-spacing:-.04em;}
.lead{margin:0 0 22px;font-size:14px;color:var(--text-3);max-width:70ch;line-height:1.65;}
h3{margin:26px 0 11px;font-size:14.5px;font-weight:800;letter-spacing:-.01em;}
h3 small{display:block;font-size:12px;font-weight:600;color:var(--text-3);margin-top:2px;letter-spacing:0;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);padding:17px;}
.grid{display:grid;gap:11px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
.nota{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 15px;
  border-radius:0 var(--r2) var(--r2) 0;font-size:13px;line-height:1.6;color:var(--text-2);}
.nota.warn{border-left-color:var(--warn);background:var(--warn-soft);}
.nota b{color:var(--text-1);}

/* ── Campos ─────────────────────────────────────────────────────────────── */
.campo{display:flex;flex-direction:column;gap:6px;}
.campo label{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);}
.campo .ayuda{font-size:11.5px;color:var(--text-4);font-weight:500;line-height:1.5;}
.campo input,.campo select{
  height:48px;padding:0 14px;border-radius:var(--r2);background:var(--surface-2);
  border:1px solid var(--line);font-size:14.5px;font-weight:600;transition:.14s var(--ease);width:100%;
}
.campo input:focus,.campo select:focus{outline:0;border-color:var(--accent-line);background:var(--surface);}
.campo input::placeholder{color:var(--text-4);font-weight:500;}
.campo.ok input{border-color:var(--accent-line);}
.campo.mal input{border-color:var(--crit-line);background:var(--crit-soft);}
.campo .err{font-size:11.5px;color:var(--crit-ink);font-weight:700;}

.opt{height:56px;border-radius:var(--r2);background:var(--surface-2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-weight:800;font-size:13.5px;color:var(--text-2);padding:0 12px;transition:.14s var(--ease);}
.opt small{font-size:10.5px;font-weight:600;opacity:.65;}
.opt:active{transform:scale(.96);}
.opt[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-bright);}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}

.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;
  font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-3);white-space:nowrap;}
.tag.ok{background:var(--accent-soft);color:var(--accent-bright);border-color:var(--accent-line);}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line);}
.tag.bad{background:var(--crit-soft);color:var(--crit-ink);border-color:var(--crit-line);}
.tag.info{background:var(--info-soft);color:var(--info);border-color:var(--info-line);}

.list{border:1px solid var(--line);border-radius:var(--r3);background:var(--panel);overflow:hidden;}
.row{display:grid;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--line-soft);}
.row:last-child{border-bottom:0;}
.row .t1{font-weight:700;font-size:13.5px;}
.row .t2{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:1px;}
.mini{width:32px;height:32px;border-radius:var(--r1);display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-3);flex-shrink:0;}
.mini:hover{color:var(--crit-ink);border-color:var(--crit-line);}

/* ── Preajustes por tipo de negocio ─────────────────────────────────────── */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:11px;}
.preset{
  padding:18px 16px;border-radius:var(--r3);background:var(--panel);border:1px solid var(--line);
  text-align:left;transition:.16s var(--ease);position:relative;overflow:hidden;
}
.preset:hover{transform:translateY(-2px);border-color:var(--accent-line);box-shadow:var(--shadow-2);}
.preset:active{transform:scale(.98);}
.preset .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  color:#fff;margin-bottom:11px;}
.preset .nm{font-size:15px;font-weight:900;letter-spacing:-.02em;}
.preset .ds{font-size:11.5px;color:var(--text-3);font-weight:600;margin-top:3px;line-height:1.5;}
.preset .qt{margin-top:9px;display:flex;gap:5px;flex-wrap:wrap;}
.preset[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);}
.preset[aria-selected="true"]::after{content:'✓';position:absolute;top:12px;right:14px;
  color:var(--accent-bright);font-weight:900;font-size:16px;}

/* ── Salud del alta ─────────────────────────────────────────────────────── */
.salud{display:grid;gap:7px;}
.chk{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:var(--r2);
  background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700;}
.chk.ok{border-color:var(--accent-line);color:var(--accent-bright);}
.chk.falta{border-color:var(--warn-line);color:var(--warn);}
.chk.bad{border-color:var(--crit-line);color:var(--crit-ink);}
.chk .d{flex:1;font-weight:600;color:var(--text-3);font-size:12px;}
.barra{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px;}
.barra span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-bright));
  border-radius:99px;transition:width .45s var(--ease);}

pre{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);
  padding:15px 17px;overflow:auto;font-size:11.5px;line-height:1.65;color:var(--text-2);
  margin:0;max-height:420px;}
pre .k{color:var(--accent-bright);} pre .s{color:var(--info);} pre .c{color:var(--text-4);}

/* ── Vista previa del punto de venta ────────────────────────────────────── */
.previa{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;background:var(--surface);}
.previa-top{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--surface-2);
  border-bottom:1px solid var(--line);font-size:12px;font-weight:700;}
.previa-cuerpo{display:grid;grid-template-columns:1fr;gap:8px;padding:13px;}
.fams{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px;}
.fam{height:52px;border-radius:var(--r2);border:1px solid var(--line);background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-2);font-size:10px;font-weight:800;overflow:hidden;}
.fam[aria-selected="true"]{color:#fff;border-color:transparent;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;}
.tile{border-radius:var(--r2);padding:9px 7px;min-height:64px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;text-align:center;color:#fff;
  box-shadow:var(--shadow-1);}
.tile .nm{font-size:10.5px;font-weight:800;line-height:1.15;}
.tile .pr{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;opacity:.9;}

/* ── Banda inferior ─────────────────────────────────────────────────────── */
#pie{height:76px;display:flex;align-items:center;gap:11px;padding:0 20px;
  background:var(--surface-2);border-top:1px solid var(--line);}
.act{height:52px;border-radius:var(--r2);display:inline-flex;align-items:center;justify-content:center;
  gap:9px;padding:0 22px;font-weight:800;font-size:14.5px;border:1px solid transparent;
  box-shadow:var(--shadow-1);transition:.14s var(--ease);}
.act:active{transform:scale(.97);}
.act[disabled]{opacity:.32;pointer-events:none;box-shadow:none;}
.act.send{background:linear-gradient(180deg,var(--accent-bright),var(--accent));color:#052018;}
.act.ghost{background:var(--surface);border-color:var(--line);color:var(--text-1);}
#pie .sp{flex:1;}
#pie .est{font-size:12.5px;color:var(--text-3);font-weight:600;}

#avisos{position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:200;display:grid;gap:7px;pointer-events:none;}
.aviso{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:var(--r2);
  background:var(--raised);border:1px solid var(--line);box-shadow:var(--shadow-2);
  font-weight:700;font-size:13.5px;animation:drop .2s var(--ease);}
@keyframes drop{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.aviso.ok{border-color:var(--accent-line);color:var(--accent-bright);}
.aviso.err{border-color:var(--crit-line);color:var(--crit-ink);}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.wrap > *{animation:rise .25s var(--ease) backwards;}

@media (max-width:820px){
  #top h1{display:none;} .wrap{padding:22px 14px 30px;}
  #pie{padding:0 13px;} #pie .est{display:none;}
}
/* ── Altas hechas a la medida ──────────────────────────────────────────── */
.alta-linea{display:flex;gap:8px;margin-top:11px;}
.alta-linea input{flex:1;min-width:0;height:48px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r1);padding:0 13px;color:var(--text-1);
  font-size:14px;font-weight:600;font-family:inherit;}
.alta-linea input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.alta-linea .act{flex-shrink:0;}

.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px;margin-top:13px;}
.tarjeta{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:13px;}
.tarjeta .th{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.tarjeta .th b{font-size:14px;color:var(--text-1);}
.tarjeta .th code{font-size:11px;color:var(--text-4);}
.tarjeta .th .x{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;
  place-items:center;background:var(--crit-soft);border:1px solid var(--crit-line);
  color:var(--crit);cursor:pointer;}
.tarjeta .tf{margin-bottom:9px;}
.tarjeta .tf label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--text-4);margin-bottom:5px;}
.tarjeta .tf input,.tarjeta .tf select{width:100%;height:40px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--text-1);
  font-size:13px;font-family:inherit;}
.tarjeta .mini{font-size:11.5px;color:var(--text-3);line-height:1.55;margin:9px 0 0;}

.mini-opts{display:flex;flex-wrap:wrap;gap:5px;}
.mini-opts button{min-height:34px;padding:0 10px;border-radius:8px;font-size:11.5px;
  font-weight:700;background:var(--surface-2);border:1px solid var(--line);
  color:var(--text-3);cursor:pointer;font-family:inherit;transition:.12s var(--ease);}
.mini-opts button.on{background:var(--info-soft);border-color:var(--info-line);color:var(--info);}
.mini-opts button:active{transform:scale(.94);}
.mini-opts.grande button{min-height:48px;padding:0 17px;font-size:13px;font-weight:800;}
.mini-opts.grande button.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);}

/* ── Vista previa de apariencia ────────────────────────────────────────── */
.prev-look{background:var(--bg);border:1px solid var(--line);border-radius:var(--r3);
  padding:15px;margin-top:11px;}
.pl-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pl-tile{border-radius:var(--r2);padding:12px 9px;min-height:78px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;
  color:#fff;box-shadow:var(--shadow-1);}
.pl-tile .nm{font-size:1em;font-weight:800;line-height:1.14;}
.pl-tile .pr{font-family:'IBM Plex Mono',monospace;font-size:.92em;font-weight:700;opacity:.92;}
.pl-cuenta{margin-top:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);overflow:hidden;}
.pl-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:10px 13px;border-bottom:1px solid var(--line-soft);}
.pl-row .q{font-family:'IBM Plex Mono',monospace;font-weight:800;color:var(--text-1);}
.pl-row .n{font-weight:600;color:var(--text-1);}
.pl-row .p{font-family:'IBM Plex Mono',monospace;font-weight:800;color:var(--text-1);}
.pl-tot{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;
  background:var(--surface-2);}
.pl-tot span{font-weight:700;color:var(--text-2);}
.pl-tot b{font-family:'IBM Plex Mono',monospace;font-size:1.5em;font-weight:900;}
.pl-act{width:100%;min-height:56px;margin-top:11px;border-radius:var(--r2);border:1px solid;
  color:#04231a;font-weight:800;font-size:1em;font-family:inherit;cursor:pointer;}
.pl-act:active{transform:scale(.97);}

/* La barra de pasos creció a 8 y dejó de caber en 1024 px. Un hijo flex no
   encoge por debajo de su contenido sin min-width:0 — el overflow-x:auto que
   ya tenía no servía de nada sin esto. Misma causa que el minmax(0,1fr) de la
   retícula del punto de venta. */
.pasos{min-width:0;flex:0 1 auto;scrollbar-width:none;}
.pasos::-webkit-scrollbar{display:none;}
.paso{flex-shrink:0;}
@media(max-width:1100px){ #top h1{display:none;} }
@media(max-width:780px){ .alta-linea{flex-wrap:wrap;} .alta-linea .act{width:100%;} }

/* #cuerpo es un elemento de retícula y los elementos de retícula traen
   min-width:auto — no encogen por debajo de su contenido. Es la misma causa
   del punto anterior, en la otra capa: la barra de pasos se arreglaba sola
   pero el contenedor seguía fijando el ancho del documento. */
#cuerpo, #top, #pie{min-width:0;}
#app{overflow-x:clip;}

</style>
<div id="app">
  <header id="top">
    <span class="brand">fullsite<i></i></span>
    <span class="sep"></span>
    <h1>Alta de restaurante</h1>
    <div class="pasos" id="pasos"></div>
    <span class="sp"></span>
    <button class="icon-btn" onclick="tema()" id="btn-tema"></button>
  </header>
  <div id="cuerpo"></div>
  <footer id="pie"></footer>
</div>
<div id="avisos"></div>

<script>
const IC = {
  /* ── Comida y bebida — cubren el catálogo de cualquier restaurante ────── */
  coffee:'<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v3M10 2v3M14 2v3"/>',
  cup:'<path d="M5 3h14l-1.5 17a2 2 0 0 1-2 1.8H8.5a2 2 0 0 1-2-1.8Z"/><path d="M6 9h12"/>',
  tea:'<path d="M4 5h13v7a6.5 6.5 0 0 1-13 0Z"/><path d="M17 7h2a2.5 2.5 0 0 1 0 5h-2"/><path d="M3 21h15"/>',
  wine:'<path d="M8 22h8M12 15v7"/><path d="M7 3h10l-.6 6a4.4 4.4 0 0 1-8.8 0Z"/>',
  beer:'<path d="M6 4h11v16H6Z"/><path d="M17 8h2.5a1.5 1.5 0 0 1 1.5 1.5v5A1.5 1.5 0 0 1 19.5 16H17"/><path d="M9.5 8v8M13.5 8v8"/>',

function iconForCategory(name){
  const n = (name||'').toLowerCase();
  for(const [keys, icon, color] of ICON_RULES){
    if(keys.some(k=>n.includes(k))) return {icon, color};
  }
  return {icon:'utensils', color:'#2e9e5b'};
}
function svg(name, size=20, sw=1.9){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[name]||IC.utensils}</svg>`;
}

  pagosPropios:[],        // {id, n, ic, tipo, comision, sat, reglas:[]}

};

/* ── Qué falta para poder operar ────────────────────────────────────────── */
function salud(){
  const c = [
    {k:'id',    ok: /^[a-z0-9-]{2,}$/.test(T.restaurant_id), req:true,
     n:'Identificador', d:'minúsculas, números y guiones — es el client_id en la base'},
    {k:'nombre',ok: T.nombre.trim().length >= 2, req:true,
     n:'Nombre del restaurante', d:'lo que ve el cliente en pantalla y en el ticket'},
    {k:'cats',  ok: T.cats.length > 0, req:true,
     n:'Categorías del menú', d:`${T.cats.length} · sin categorías no hay nada que vender`},
    {k:'pagos', ok: T.pagos.length > 0, req:true,
     n:'Formas de pago', d:`${T.pagos.length} · al menos una para poder cobrar`},
    {k:'mesas', ok: T.mesas.length > 0, req:false,
     n:'Mesas', d:`${T.mesas.length} · un mostrador puede operar sin mesas`},
    {k:'gente', ok: T.staff.length > 0, req:false,
     n:'Personal', d:`${T.staff.length} · se puede dar de alta después`},
    {k:'est',   ok: T.estaciones.length > 0, req:false,
     n:'Estaciones', d:`${T.estaciones.length} · a dónde va cada comanda`},
  ];
  const req = c.filter(x => x.req);
  return {c, listo: req.every(x => x.ok), pct: Math.round(c.filter(x=>x.ok).length / c.length * 100)};
}

/* ── Catalogo + lo hecho a la medida, en una sola lista ─────────────────── */
// El esquema real de impresoras (printer-config-schema.js) dice que los nombres
// de estacion son texto libre por restaurante. Esta plantilla tiene que poder
// lo mismo, o estaria prometiendo menos de lo que el sistema da.
const slug = n => n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);

function estacionesTodas(){
  return [...Object.entries(ESTACIONES_CAT).map(([k,e])=>({id:k, n:e.n, ic:e.ic, propia:false})),
          ...T.estacionesPropias.map(e=>({...e, propia:true}))];
}
function pagosTodos(){
  return [...Object.entries(PAGOS_CAT).map(([k,p])=>({id:k, ...p, propia:false})),
          ...T.pagosPropios.map(p=>({...p, propia:true}))];
}

function nuevaEstacion(){
  const n = (document.getElementById('est-nueva')||{}).value || '';
  if(!n.trim()) return aviso('warn','Ponle nombre a la estación.');
  const id = slug(n);
  if(!id) return aviso('warn','Ese nombre no deja un identificador usable.');
  if(estacionesTodas().some(e=>e.id===id)) return aviso('warn',`«${n}» ya existe.`);
  T.estacionesPropias.push({id, n:n.trim(), ic:'chef', docs:['kitchen_ticket'], respaldo:'cocina'});
  T.estaciones.push(id);
  pinta(); aviso('ok',`Estación «${n.trim()}» agregada.`);
}
function borraEstacion(id){
  T.estacionesPropias = T.estacionesPropias.filter(e=>e.id!==id);
  T.estaciones = T.estaciones.filter(k=>k!==id);
  pinta();
}
function nuevoPago(){
  const n = (document.getElementById('pago-nuevo')||{}).value || '';
  if(!n.trim()) return aviso('warn','Ponle nombre a la forma de cobro.');
  const id = slug(n);
  if(!id) return aviso('warn','Ese nombre no deja un identificador usable.');
  if(pagosTodos().some(p=>p.id===id)) return aviso('warn',`«${n}» ya existe.`);
  T.pagosPropios.push({id, n:n.trim(), ic:'receipt', tipo:'vale', comision:0, sat:'', reglas:[]});
  T.pagos.push(id);
  pinta(); aviso('ok',`Forma de cobro «${n.trim()}» agregada.`);
}
function borraPago(id){
  T.pagosPropios = T.pagosPropios.filter(p=>p.id!==id);
  T.pagos = T.pagos.filter(k=>k!==id);
  pinta();
}
function editaEst(id, campo, val){
  const e = T.estacionesPropias.find(x=>x.id===id); if(!e) return;
  if(campo==='doc'){ const i=e.docs.indexOf(val); i>=0 ? e.docs.splice(i,1) : e.docs.push(val); }
  else e[campo]=val;
  pinta();
}
function editaPago(id, campo, val){
  const p = T.pagosPropios.find(x=>x.id===id); if(!p) return;
  p[campo]=val; pinta();
}
function aplicaLook(){
  const r = document.documentElement;
  r.style.setProperty('--escala-demo', T.look.escala+'%');
}

/* ── Render ─────────────────────────────────────────────────────────────── */
function pintaPasos(){
  document.getElementById('pasos').innerHTML = PASOS.map((p,i) =>
    `<button class="paso ${i < PASO ? 'listo' : ''}" aria-current="${i === PASO}"
      onclick="irA(${i})"><span class="n">${i < PASO ? '✓' : i+1}</span>${p.n}</button>`).join('');
}
function irA(i){ PASO = Math.max(0, Math.min(PASOS.length-1, i)); pinta(); }
function sig(){ irA(PASO + 1); }
function ant(){ irA(PASO - 1); }

function pinta(){
  pintaPasos();
  const s = salud();
  document.getElementById('cuerpo').scrollTop = 0;
  document.getElementById('cuerpo').innerHTML = VISTAS[PASOS[PASO].k]();
  const ultimo = PASO === PASOS.length - 1;
  document.getElementById('pie').innerHTML = `
    <button class="act ghost" onclick="ant()" ${PASO === 0 ? 'disabled' : ''}>
      ${svg('left',18,2.4)}<span>Atrás</span></button>
    <span class="sp"></span>
    <span class="est">${s.listo ? 'Listo para operar' : 'Faltan datos obligatorios'} · ${s.pct}%</span>
    ${ultimo
      ? `<button class="act send" onclick="copiarTenant()" ${s.listo ? '' : 'disabled'}>
          ${svg('check',18,2.4)}<span>Copiar el TENANT</span></button>`
      : `<button class="act send" onclick="sig()">
          <span>Siguiente</span>${svg('right',18,2.4)}</button>`}`;
}

            : `Si no contesta, el ticket sale en ${e.respaldo} y alguien lo lleva.`}</p>
        </div>`).join('')}</div>` : ''}
      ${T.estaciones.length ? `<div class="nota" style="margin-top:14px">
        <b>Cada estación necesita decir si imprime.</b> Una panadería sin impresora lleva su
        producción en pantalla; una cocina con impresora recibe la comanda en papel.
        Eso se configura en cada terminal, no aquí.</div>` : ''}

      <h3>Primera terminal</h3>
      <div class="grid g3">
        <div class="campo"><label>Nombre</label>
          <input value="${T.terminal.name}" oninput="T.terminal.name=this.value"></div>
        <div class="campo"><label>Tipo</label>
          <select onchange="T.terminal.role=this.value">
            ${[['server_pos','Caja principal'],['pos','Terminal de mesero'],
               ['kds','Pantalla de cocina'],['admin','Administración']].map(([v,n]) =>
              `<option value="${v}" ${T.terminal.role===v?'selected':''}>${n}</option>`).join('')}</select></div>
        <div class="campo"><label>Identificador</label>
          <input value="${T.terminal.id}" oninput="T.terminal.id=this.value"></div>
      </div>
      <p class="ayuda" style="font-size:12px;color:var(--text-4);margin-top:8px">
        El tipo decide qué pantallas existen en esa máquina: una caja no muestra Cocina ni Barra,
        y una pantalla de cocina no muestra nada más.</p>
    </div>`;
  },

  /* ── 7 · Apariencia ──────────────────────────────────────────────────── */
  look(){
    const L = T.look;
    const fuentes = [
      ['Public Sans','la nuestra — probada a 2 m de distancia'],
      ['Schibsted Grotesk','más carácter, para marcas con presencia'],
      ['system-ui','la del equipo — la más rápida en máquinas viejas'],
    ];
    return `<div class="wrap">
      <h2>Cómo se ve</h2>
      <p class="lead">Esto lo cambia el cliente cuando quiera, desde la caja, sin llamar a nadie.
      El tamaño de letra no es capricho: en una barra con luz de sol, o con un cajero que ya
      no ve de cerca, subirlo 20&nbsp;% es la diferencia entre leer y adivinar.</p>

      <h3>Tipografía</h3>
      <div class="opts">${fuentes.map(([f,d]) =>
        `<button class="opt" aria-selected="${L.fuente===f}" onclick="T.look.fuente='${f}';pinta()"
          style="font-family:'${f}',system-ui"><span>${f}</span><small>${d}</small></button>`).join('')}</div>
      <p class="ayuda" style="font-size:12px;color:var(--text-4);margin-top:7px">
        Los números y el dinero siempre van en monoespaciada, pase lo que pase con esta
        elección: una columna de precios que baila se lee mal y se suma peor.</p>

      <h3>Tamaño<small>Se aplica a todo el punto de venta</small></h3>
      <div class="mini-opts grande">${[85,100,115,130,150].map(e =>
        `<button class="${L.escala===e?'on':''}" onclick="T.look.escala=${e};pinta()">${e}%</button>`).join('')}</div>

      <h3>Tema</h3>
      <div class="opts">${[['oscuro','para salón con luz baja'],['claro','para barra con sol directo'],
        ['auto','sigue la hora del turno']].map(([t,d]) =>
        `<button class="opt" aria-selected="${L.tema===t}" onclick="T.look.tema='${t}';pinta()">
          ${svg(t==='claro'?'eye':'moon',17)}<span>${t}</span><small>${d}</small></button>`).join('')}</div>

      <h3>Color de acción<small>El único color que confirma</small></h3>
      <div class="mini-opts grande">${['#10B981','#3b82f6','#8b5cf6','#e07b39','#ec4899'].map(c =>
        `<button class="${L.acento===c?'on':''}" onclick="T.look.acento='${c}';pinta()"
          style="background:${c}22;border-color:${c};color:${c}">${c}</button>`).join('')}</div>
      <p class="ayuda" style="font-size:12px;color:var(--text-4);margin-top:7px">
        Se cambia el de acción, nunca los de estado: rojo es pérdida, ámbar es espera y
        azul es en curso en todos los restaurantes. Reasignarlos rompe la lectura de reojo.</p>

      <h3>Así queda</h3>
      <div class="prev-look" style="font-family:'${L.fuente}',system-ui;font-size:${L.escala}%">
        <div class="pl-tiles">
          ${[['Chilaquiles Verdes',292,'#2e9e5b'],['Café Americano',48,'#a8703a'],
             ['Copa de vino',170,'#8b5cf6']].map(([n,pr,c]) =>
            `<div class="pl-tile" style="background:linear-gradient(150deg,${c},${c}cc)">
              <span class="nm">${n}</span><span class="pr">$${pr}</span></div>`).join('')}
        </div>
        <div class="pl-cuenta">
          <div class="pl-row"><span class="q">2</span><span class="n">Chilaquiles Verdes</span><span class="p">$584</span></div>
          <div class="pl-row"><span class="q">1</span><span class="n">Café Americano</span><span class="p">$48</span></div>
          <div class="pl-tot"><span>Total</span><b style="color:${L.acento}">$632</b></div>
        </div>
        <button class="pl-act" style="background:${L.acento};border-color:${L.acento}">Enviar a cocina</button>
      </div>
      <p class="ayuda" style="font-size:12px;color:var(--text-4);margin-top:9px">
        ${L.escala >= 130
          ? 'A este tamaño caben menos productos por pantalla. La retícula se recalcula sola y pagina: nunca aparece una barra de scroll.'
          : L.escala <= 85
          ? 'A este tamaño cabe más, pero se pierde legibilidad a distancia. Sólo tiene sentido en pantallas grandes de administración.'
          : 'Tamaño normal: la retícula acomoda la mayor cantidad de productos sin bajar de 56 px de alto por celda.'}</p>
    </div>`;
  },

  /* ── 7 · Revisar ─────────────────────────────────────────────────────── */
  listo(){
    const s = salud();
    return `<div class="wrap ancho">
      <h2>${s.listo ? 'Listo para operar' : 'Falta algo antes de operar'}</h2>
      <p class="lead">${s.listo
        ? 'Este restaurante ya puede vender. Copia el objeto y pégalo donde corresponde.'
        : 'Lo marcado en ámbar es obligatorio: sin eso el punto de venta no puede abrir.'}</p>

      <div class="barra"><span style="width:${s.pct}%"></span></div>
      <div style="font-size:12px;color:var(--text-3);font-weight:700;margin-bottom:18px">${s.pct}% completo</div>

      <div class="grid g2" style="align-items:start">
        <div>
          <h3 style="margin-top:0">Revisión</h3>
          <div class="salud">${s.c.map(x => `
            <div class="chk ${x.ok ? 'ok' : x.req ? 'falta' : ''}">
              ${svg(x.ok ? 'check' : x.req ? 'alert' : 'info', 17, 2.4)}
              <span>${x.n}</span><span class="d">${x.d}</span>
              ${!x.ok && !x.req ? '<span class="tag">opcional</span>' : ''}</div>`).join('')}</div>

          <h3>Así se ve el menú</h3>
          ${T.cats.length ? previaMenu() : '<div class="nota warn">Sin categorías todavía.</div>'}
        </div>

        <div>
          <h3 style="margin-top:0">El objeto TENANT</h3>
          <pre id="salida">${pintarTenant()}</pre>
          <div class="nota" style="margin-top:12px">
            <b>Dónde va esto.</b> En producción, el identificador entra al
            <code>TerminalConfig</code> de cada máquina, y el resto se carga solo desde la base
            filtrando por <code>client_id</code>. Este objeto es el <b>contrato</b>: si está
            completo, el punto de venta arranca sin tocar código.
          </div>
        </div>
      </div>
    </div>`;
  },
};

const PERM_POR_ROL = {admin:57, gerente:46, capitan:23, cajero:16, mesero:5};

/* ── Vista previa del menú, con los iconos que de verdad le tocan ───────── */
function previaMenu(){
  const fams = T.cats.slice(0, 8).map(c => ({n:c, ...iconForCategory(c)}));
  const ejemplos = ['Producto 1','Producto 2','Producto 3','Producto 4','Producto 5','Producto 6'];
  const col = fams.length ? fams[0].color : '#2e9e5b';
  return `<div class="previa">
    <div class="previa-top">
      <span class="brand" style="font-size:14px">fullsite<i></i></span>
      <span style="color:var(--text-3)">${T.nombre || 'Tu restaurante'}</span>
    </div>
    <div class="previa-cuerpo">
      <div class="fams">${fams.map((f,i) => `
        <div class="fam" aria-selected="${i===0}" style="${i===0?`background:${f.color};`:''}">
          ${svg(f.icon,18)}<span>${f.n.length>13?f.n.slice(0,11)+'…':f.n}</span></div>`).join('')}</div>
      <div class="tiles">${ejemplos.map((e,i) => `
        <div class="tile" style="background:linear-gradient(150deg,${col},${col}cc)">
          <span class="nm">${e}</span><span class="pr">$—</span></div>`).join('')}</div>
    </div>
  </div>`;
}

function pintarTenant(){
  const o = {
    restaurant_id: T.restaurant_id || '—',
    nombre: T.nombre || '—',
    terminal: T.terminal,
    moneda: {codigo:T.moneda, simbolo:T.moneda==='MXN'||T.moneda==='USD'?'$':'€', locale:'es-MX'},
    impuesto: {nombre:T.impuesto, tasa:T.tasa/100, incluido:false},
    propinas: T.propinas.slice().sort((a,b)=>a-b),
    zonas: T.zonas,
    mesas: T.mesas.map(m => ({n:m.n, z:m.z, cap:m.cap, s:'round', x:50, y:50})),
    // Se resuelve contra la lista efectiva —catalogo + lo hecho a la medida—,
    // no contra el catalogo fijo: una estacion propia no existe en ESTACIONES_CAT
    // y buscarla ahi reventaba la exportacion.
    estaciones: T.estaciones.map(k => {
      const e = estacionesTodas().find(x => x.id === k) || {n:k, ic:'chef'};
      const propia = T.estacionesPropias.find(x => x.id === k);
      return {k, n:e.n, ic:e.ic, imprime:true,
              documentos: propia ? propia.docs : ['kitchen_ticket'],
              respaldo: propia ? propia.respaldo : 'cocina'};
    }),
    pagos: T.pagos.map(k => {
      const p = pagosTodos().find(x => x.id === k) || {n:k, ic:'receipt'};
      const {id, propia, ...resto} = p;
      return {k, ...resto};
    }),
    apariencia: T.look,
    staff: T.staff,
    menu: T.cats.map(c => ({n:c, items:[]})),
  };
  return JSON.stringify(o, null, 2)
    .replace(/"([a-z_]+)":/g, '<span class="k">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>');
}

/* ── Acciones ───────────────────────────────────────────────────────────── */
function elegirPreset(k){
  const p = PRESETS.find(x => x.k === k);
  T.preset = k;
  T.cats = [...p.cats];
  T.pagos = [...p.pagos];
  T.estaciones = [...p.estaciones];
  T.zonas = [...p.zonas];
  T.propinas = [...p.propinas];
  T.mesas = [];
  if(p.mesas && p.zonas.length){
    for(let i = 1; i <= p.mesas; i++)
      T.mesas.push({n:i, z:p.zonas[(i-1) % p.zonas.length], cap:4});
  }
  pinta();
  aviso('ok', `${p.n} · ${p.cats.length} categorías y ${T.mesas.length} mesas precargadas`);
}
function sugerirId(){
  T.restaurant_id = T.nombre.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28);
  const el = document.getElementById('f-id'); if(el) el.value = T.restaurant_id;
}
function marcar(){
  const s = salud();
  const est = document.querySelector('#pie .est');
  if(est) est.textContent = `${s.listo ? 'Listo para operar' : 'Faltan datos obligatorios'} · ${s.pct}%`;
}
function togProp(v){
  const i = T.propinas.indexOf(v);
  if(i >= 0) T.propinas.splice(i,1); else T.propinas.push(v);
  pinta();
}
function addCat(){
  const el = document.getElementById('f-cat'), v = el.value.trim();
  if(!v) return;
  if(T.cats.some(c => c.toLowerCase() === v.toLowerCase())){ aviso('err','Esa categoría ya existe'); return; }
  T.cats.push(v); el.value = ''; pinta();
  setTimeout(() => { const n = document.getElementById('f-cat'); if(n) n.focus(); }, 40);
}
function delCat(i){ T.cats.splice(i,1); pinta(); }
function addZona(){
  const el = document.getElementById('f-zona'), v = el.value.trim();
  if(!v) return;
  if(T.zonas.includes(v)){ aviso('err','Esa zona ya existe'); return; }
  T.zonas.push(v); el.value = ''; pinta();
  setTimeout(() => { const n = document.getElementById('f-zona'); if(n) n.focus(); }, 40);
}
function delZona(i){
  const z = T.zonas[i];
  T.mesas = T.mesas.filter(m => m.z !== z);
  T.zonas.splice(i,1); pinta();
}
function addMesas(){
  const q = Number(document.getElementById('f-cuantas').value) || 0;
  const z = document.getElementById('f-enzona').value;
  const cap = Number(document.getElementById('f-cap').value) || 4;
  let n = T.mesas.length ? Math.max(...T.mesas.map(m => m.n)) : 0;
  for(let i = 0; i < q; i++) T.mesas.push({n: ++n, z, cap});
  pinta(); aviso('ok', `${q} mesas agregadas a ${z}`);
}
function delMesasZona(z){ T.mesas = T.mesas.filter(m => m.z !== z); pinta(); }
function addPersona(){
  const el = document.getElementById('f-persona'), v = el.value.trim();
  if(!v) return;
  T.staff.push({n:v, r:document.getElementById('f-rol').value});
  el.value = ''; pinta();
  setTimeout(() => { const n = document.getElementById('f-persona'); if(n) n.focus(); }, 40);
}
function delPersona(i){ T.staff.splice(i,1); pinta(); }
function togPago(k){
  const i = T.pagos.indexOf(k);
  if(i >= 0) T.pagos.splice(i,1); else T.pagos.push(k);
  pinta();
}
function togEst(k){
  const i = T.estaciones.indexOf(k);
  if(i >= 0) T.estaciones.splice(i,1); else T.estaciones.push(k);
  pinta();
}
function copiarTenant(){
  const txt = document.getElementById('salida').textContent;
  try { navigator.clipboard.writeText(txt); aviso('ok','TENANT copiado al portapapeles'); }
  catch { aviso('err','No se pudo copiar — selecciona el texto a mano'); }
}
function aviso(kind, msg){
  const el = document.createElement('div');
  el.className = 'aviso ' + kind;
  el.innerHTML = svg(kind === 'ok' ? 'check' : 'alert', 16, 2.4) + msg;
  document.getElementById('avisos').appendChild(el);
  setTimeout(() => el.remove(), 2600);
}
function tema(){
  const r = document.documentElement;
  const claro = r.dataset.theme === 'light';
  if(claro) r.removeAttribute('data-theme'); else r.dataset.theme = 'light';
  document.getElementById('btn-tema').innerHTML = svg(claro ? 'moon' : 'eye', 18);
}

document.getElementById('btn-tema').innerHTML = svg('moon', 18);
pinta();

</script>
